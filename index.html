<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKT Register V10.50 - Improved Mini Floating</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tesseract.js Engine -->
  <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    
    html, body {
      background-color: transparent !important;
      font-family: 'Sarabun', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* กล่อง Floating หลัก ยึดตำแหน่งมุมขวาล่าง */
    #mktFloatingWidget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999999;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* สถานะปกติ: ไอคอนลอยจิ๋ว (Mini Badge) */
    .mkt-mini-mode {
      width: auto !important;
      height: auto !important;
    }

    .mkt-mini-mode #mktFullForm {
      display: none !important;
    }

    .mkt-mini-mode #mktMiniBar {
      display: flex !important;
    }

    /* สถานะกางออก: ฟอร์มเต็ม (Full Form) */
    .mkt-full-mode {
      width: 400px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 40px);
      background: #ffffff;
      border: 2px solid #0d9488;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    .mkt-full-mode #mktMiniBar {
      display: none !important;
    }

    .mkt-full-mode #mktFullForm {
      display: block !important;
    }

    .mkt-drag-handle {
      cursor: move;
      user-select: none;
    }
  </style>
</head>
<body>

  <canvas id="cropCanvas" class="hidden"></canvas>
  <canvas id="faceCanvas" class="hidden"></canvas>
  <canvas id="isolatedNameCanvas" class="hidden"></canvas>

  <!-- Main Floating Widget Container -->
  <div id="mktFloatingWidget" class="mkt-mini-mode">

    <!-- 1. MODE ICON จิ๋ว (ไม่บังหน้าจอ) -->
    <div id="mktMiniBar" class="hidden items-center gap-2 bg-teal-800 text-white p-2 pr-3 rounded-full shadow-2xl border-2 border-teal-400 mkt-drag-handle">
      <!-- ปุ่มกดอ่านบัตรด่วนพร้อมไอคอนแสดงสถานะเมื่อกดอ่าน -->
      <button id="btnMiniRead" type="button" onclick="readSmartCardHardware()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white p-2 rounded-full shadow transition-all flex items-center justify-center" title="กดอ่านบัตร Smart Card ทันที">
        <i id="iconMiniRead" data-lucide="credit-card" class="w-5 h-5"></i>
        <i id="iconMiniSpin" data-lucide="loader-2" class="w-5 h-5 animate-spin hidden"></i>
      </button>

      <!-- ปุ่มกดขยายหน้าต่างฟอร์มเต็ม -->
      <button type="button" onclick="expandWidget()" class="flex items-center gap-1.5 hover:text-teal-200 transition-colors pl-1">
        <i data-lucide="shield-check" class="w-4 h-4 text-teal-300"></i>
        <span id="miniStatusText" class="text-xs font-bold font-mono">อ่านบัตร MKT</span>
        <i data-lucide="maximize-2" class="w-3.5 h-3.5 text-slate-300"></i>
      </button>
    </div>


    <!-- 2. MODE FULL FORM (กางออกเมื่ออ่านบัตรเสร็จ หรือเมื่อกดขยาย) -->
    <div id="mktFullForm" class="hidden">
      <!-- Header Bar -->
      <header id="mktHeader" class="bg-teal-700 text-white p-3 shadow-md sticky top-0 z-20 mkt-drag-handle space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="grip-horizontal" class="w-4 h-4 text-teal-200"></i>
            <i data-lucide="shield-check" class="w-4 h-4"></i>
            <div>
              <h1 class="text-xs font-bold leading-tight">ลงทะเบียนผู้ป่วย</h1>
              <p class="text-[9px] text-teal-200">MKT Smart Register V10.50</p>
            </div>
          </div>
          <span class="text-[10px] bg-teal-800 border border-teal-500/30 text-teal-100 px-2 py-0.5 rounded-full font-mono">ACR39U</span>
        </div>

        <!-- แถบปุ่มอ่านบัตร และปุ่มย่อหน้าต่าง (Minimize) วางคู่อย่างชัดเจน ไม่สูงเกินไป -->
        <div class="flex items-center gap-2">
          <button type="button" onclick="readSmartCardHardware()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition-all flex items-center justify-center gap-2 border border-emerald-400">
            <i data-lucide="credit-card" class="w-4 h-4"></i>
            <span>อ่านข้อมูลจากบัตร Smart Card</span>
          </button>
          
          <button type="button" onclick="minimizeWidget()" class="bg-teal-800 hover:bg-teal-900 text-white p-2 rounded-lg transition-colors border border-teal-600 flex items-center justify-center" title="ย่อเป็นไอคอนจิ๋ว">
            <i data-lucide="minimize-2" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- Main Content Form -->
      <main class="p-3 space-y-3">

        <!-- Input Mode Switcher Card -->
        <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200">
          <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl mb-3">
            <button id="tabReader" onclick="switchMode('reader')" class="py-1.5 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex flex-col items-center gap-1">
              <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
              <span>Smart Card</span>
            </button>
            <button id="tabCamera" onclick="switchMode('camera')" class="py-1.5 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex flex-col items-center gap-1">
              <i data-lucide="camera" class="w-3.5 h-3.5"></i>
              <span>ถ่ายรูปกล้อง</span>
            </button>
            <button id="tabBrowse" onclick="switchMode('browse')" class="py-1.5 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex flex-col items-center gap-1">
              <i data-lucide="upload" class="w-3.5 h-3.5"></i>
              <span>Browse ไฟล์</span>
            </button>
          </div>

          <!-- Mode 1: Smart Card Reader Mode -->
          <div id="modeReader" class="space-y-3">
            <div class="bg-teal-50/60 border-2 border-dashed border-teal-400/60 rounded-xl p-3 text-center">
              <div class="w-8 h-8 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center mx-auto mb-1">
                <i data-lucide="usb" class="w-4 h-4 animate-pulse"></i>
              </div>
              <p class="text-[10px] text-slate-500 mb-2">รองรับ Windows PC และ Android Tablet OTG</p>
              <button onclick="readSmartCardHardware()" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition-all flex items-center justify-center gap-1.5">
                <i data-lucide="credit-card" class="w-3.5 h-3.5"></i>
                <span>อ่านข้อมูลจากบัตร</span>
              </button>
            </div>
          </div>

          <!-- Mode 2: Camera View -->
          <div id="modeCamera" class="hidden space-y-3">
            <div id="cameraArea" class="relative bg-slate-900 rounded-xl overflow-hidden min-h-[160px] flex flex-col items-center justify-center text-white">
              <video id="webcam" autoplay playsinline class="hidden w-full h-auto object-cover"></video>
              <div id="cardGuide" class="hidden pointer-events-none absolute inset-0 items-center justify-center">
                <div id="cardGuideFrame" class="aspect-[1.586/1] border-[3px] border-white rounded-xl shadow-[0_0_0_999px_rgba(0,0,0,.28)] relative transition-colors duration-200">
                  <span id="cameraHint" class="absolute -bottom-7 left-0 right-0 text-center text-xs text-white">วางบัตรในกรอบ</span>
                </div>
              </div>
              
              <div id="startState" class="p-3 text-center">
                <button onclick="startCamera()" class="bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 px-4 rounded-xl flex items-center justify-center gap-2 mx-auto text-xs shadow">
                  <i data-lucide="camera" class="w-4 h-4"></i>
                  <span>เปิดกล้องถ่ายภาพบัตร</span>
                </button>
              </div>

              <div id="cameraControls" class="hidden absolute top-2 left-2 right-2 z-20 bg-black/55 rounded-lg px-2 py-1">
                <div class="flex justify-between items-center text-[10px]">
                  <span id="focusText">กำลังปรับ Focus...</span>
                  <span id="zoomText">มุมกว้าง</span>
                </div>
                <input id="zoomSlider" type="range" class="hidden w-full accent-teal-400" oninput="setCameraZoom(this.value)">
              </div>

              <button id="snapBtn" onclick="takeSnapshot()" class="hidden absolute z-30 bg-red-600 hover:bg-red-700 text-white font-semibold px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1 text-xs">
                <i data-lucide="aperture" class="w-3.5 h-3.5"></i>
                <span>ถ่ายภาพบัตร</span>
              </button>
            </div>
          </div>

          <!-- Mode 3: Browse View -->
          <div id="modeBrowse" class="hidden space-y-3">
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            <button onclick="document.getElementById('fileInput').click()" class="w-full border-2 border-dashed border-teal-500 bg-teal-50/50 hover:bg-teal-50 text-teal-700 font-medium py-5 px-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-all">
              <i data-lucide="image-plus" class="w-5 h-5"></i>
              <span class="text-xs font-semibold">เลือกไฟล์รูปภาพบัตรประชาชน</span>
            </button>
          </div>

          <!-- Status Indicator -->
          <div id="ocrStatus" class="hidden mt-2 p-2 bg-slate-50 rounded-lg border border-slate-200">
            <div class="flex items-center gap-2">
              <div class="w-12 h-9 bg-slate-200 rounded overflow-hidden flex-shrink-0 relative flex items-center justify-center">
                <img id="cardPreview" class="w-full h-full object-cover hidden" src="" alt="Preview">
                <i id="cardIcon" data-lucide="credit-card" class="w-4 h-4 text-slate-400"></i>
              </div>
              <div class="flex-1 min-w-0">
                <div id="statusLabel" class="text-[10px] font-semibold text-teal-700 flex items-center gap-1">
                  <i id="statusSpinner" data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>
                  <span id="statusText">กำลังประมวลผล...</span>
                </div>
                <div class="w-full bg-slate-200 h-1 rounded-full mt-1 overflow-hidden">
                  <div id="progressBar" class="bg-teal-600 h-full w-0 transition-all duration-300"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Form Section -->
        <form id="regForm" onsubmit="handleSubmit(event)" class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 space-y-2.5">
          <div class="border-b border-slate-100 pb-2 flex items-center gap-3">
            <div class="w-14 h-16 bg-slate-100 border border-dashed border-slate-300 rounded-lg flex flex-col items-center justify-center overflow-hidden flex-shrink-0">
              <img id="facePreview" class="hidden w-full h-full object-cover" src="" alt="Face">
              <div id="facePlaceholder" class="text-center text-slate-400">
                <i data-lucide="user" class="w-5 h-5 mx-auto"></i>
              </div>
            </div>
            <div class="flex-1 min-w-0">
              <h2 class="text-xs font-semibold text-slate-800">ข้อมูลผู้ป่วย</h2>
              <p id="sourceLabel" class="text-[9px] text-slate-400">รอรับข้อมูล...</p>
              <span id="ocrBadge" class="hidden inline-block mt-0.5 text-[8px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-medium">Extracted</span>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-medium text-slate-600 mb-0.5">เลขบัตรประชาชน *</label>
            <input type="text" id="idCard" placeholder="รอข้อมูล..." required class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded text-xs text-slate-800 focus:outline-none focus:border-teal-500">
          </div>

          <div>
            <label class="block text-[10px] font-medium text-slate-600 mb-0.5">ชื่อ - นามสกุล *</label>
            <input type="text" id="fullName" placeholder="รอข้อมูล..." required class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded text-xs text-slate-800 focus:outline-none focus:border-teal-500">
          </div>

          <div>
            <label class="block text-[10px] font-medium text-slate-600 mb-0.5">วันเกิด</label>
            <input type="text" id="dob" placeholder="รอข้อมูล..." class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded text-xs text-slate-800 focus:outline-none focus:border-teal-500">
          </div>

          <div>
            <label class="block text-[10px] font-medium text-slate-600 mb-0.5">ที่อยู่ตามบัตรประชาชน</label>
            <textarea id="address" rows="2" placeholder="รอข้อมูล..." class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded text-xs text-slate-800 focus:outline-none focus:border-teal-500"></textarea>
          </div>

          <!-- ปุ่มบันทึกการลงทะเบียน (เมื่อกดแล้วจะย่อกลับอัตโนมัติ) -->
          <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold py-2 rounded-lg shadow transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="save" class="w-3.5 h-3.5"></i>
            <span>บันทึกการลงทะเบียน</span>
          </button>
        </form>
      </main>
    </div>

  </div>

  <script>
    /* =========================================================
     * WIDGET CONTROLLER & DRAGGABLE LOGIC
     * ========================================================= */
    function minimizeWidget() {
      const widget = document.getElementById('mktFloatingWidget');
      widget.className = 'mkt-mini-mode';
    }

    function expandWidget() {
      const widget = document.getElementById('mktFloatingWidget');
      widget.className = 'mkt-full-mode';
    }

    function setMiniReadingState(isLoading) {
      const iconCard = document.getElementById('iconMiniRead');
      const iconSpin = document.getElementById('iconMiniSpin');
      const textStatus = document.getElementById('miniStatusText');
      
      if (isLoading) {
        iconCard.classList.add('hidden');
        iconSpin.classList.remove('hidden');
        textStatus.innerText = 'กำลังอ่านบัตร...';
      } else {
        iconSpin.classList.add('hidden');
        iconCard.classList.remove('hidden');
        textStatus.innerText = 'อ่านบัตร MKT';
      }
    }

    function initDraggable(element, dragHandles) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      
      dragHandles.forEach(handle => {
        if (!handle) return;
        handle.onmousedown = dragMouseDown;
      });

      function dragMouseDown(e) {
        if (e.target.closest('button') || e.target.closest('input')) return;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        element.style.top = (element.offsetTop - pos2) + "px";
        element.style.left = (element.offsetLeft - pos1) + "px";
        element.style.bottom = 'auto';
        element.style.right = 'auto';
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const widget = document.getElementById('mktFloatingWidget');
      const miniBar = document.getElementById('mktMiniBar');
      const header = document.getElementById('mktHeader');
      initDraggable(widget, [miniBar, header]);
    });

    /* =========================================================
     * HARDWARE & OCR LOGIC
     * ========================================================= */
    lucide.createIcons();
    let videoStream = null;
    let agentRetryInProgress = false;
    let activeSmartCardSession = false;
    let absentCardChecks = 0;
    let ocrWorkerPromise = null;
    let cameraQualityTimer = null;
    let previousQualityFrame = null;
    let bestObservedSharpness = 0;
    let cameraQualitySamples = 0;

    async function waitForLocalAgent(maxAttempts = 12) {
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        try {
          const response = await fetch('http://127.0.0.1:8181/health', { method: 'GET', cache: 'no-store' });
          if (response.ok) return true;
        } catch (_) {}
        await new Promise(resolve => setTimeout(resolve, 500));
      }
      return false;
    }

    async function resumePendingCardRead() {
      if (agentRetryInProgress || sessionStorage.getItem('mktPendingCardRead') !== '1') return;
      if (document.visibilityState && document.visibilityState !== 'visible') return;
      agentRetryInProgress = true;
      const status = document.getElementById('ocrStatus');
      const statusText = document.getElementById('statusText');
      status.classList.remove('hidden');
      statusText.innerText = 'กลับจาก Agent แล้ว กำลังรออ่านบัตร...';

      const ready = await waitForLocalAgent();
      sessionStorage.removeItem('mktPendingCardRead');
      agentRetryInProgress = false;
      if (ready) {
        await readSmartCardHardware({ skipAgentLaunch: true });
      } else {
        document.getElementById('statusSpinner').classList.add('hidden');
        statusText.innerText = 'Agent ยังไม่พร้อม';
        setMiniReadingState(false);
      }
    }

    document.addEventListener('visibilitychange', resumePendingCardRead);
    window.addEventListener('focus', resumePendingCardRead);
    window.addEventListener('pageshow', resumePendingCardRead);

    window.onAndroidSmartCardRead = function(jsonData) {
      const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
      fillFormData(data.idCard, data.fullName, data.dob, data.address, data.photoBase64, "Android Native OTG SmartCard");
      startCardRemovalWatch();
      setMiniReadingState(false);
      expandWidget(); // กางฟอร์มออกดูข้อมูลเมื่ออ่านเสร็จ
    };

    function startCardRemovalWatch() {
      activeSmartCardSession = true;
      absentCardChecks = 0;
    }

    async function checkCardRemoval() {
      if (!activeSmartCardSession || document.visibilityState === 'hidden') return;
      try {
        const response = await fetch('http://127.0.0.1:8181/card-status', { cache: 'no-store' });
        if (!response.ok) return;
        const state = await response.json();
        if (state.status !== 'ok' || !state.readerReady) return;
        if (state.cardPresent) {
          absentCardChecks = 0;
          return;
        }
        absentCardChecks++;
        if (absentCardChecks < 2) return;
        activeSmartCardSession = false;
        absentCardChecks = 0;
        clearFormInputs();
        document.getElementById('ocrStatus').classList.remove('hidden');
        document.getElementById('statusSpinner').classList.add('hidden');
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('statusText').innerText = 'นำบัตรออกแล้ว';
        document.getElementById('sourceLabel').innerText = 'ยังไม่มีข้อมูลผู้ป่วย';
      } catch (_) {}
    }

    setInterval(checkCardRemoval, 800);

    function clearFormInputs() {
      document.getElementById('idCard').value = "";
      document.getElementById('fullName').value = "";
      document.getElementById('dob').value = "";
      document.getElementById('address').value = "";
      document.getElementById('facePreview').classList.add('hidden');
      document.getElementById('facePlaceholder').classList.remove('hidden');
      document.getElementById('ocrBadge').classList.add('hidden');
    }

    function switchMode(mode) {
      const tabReader = document.getElementById('tabReader');
      const tabCamera = document.getElementById('tabCamera');
      const tabBrowse = document.getElementById('tabBrowse');
      const modeReader = document.getElementById('modeReader');
      const modeCamera = document.getElementById('modeCamera');
      const modeBrowse = document.getElementById('modeBrowse');

      [tabReader, tabCamera, tabBrowse].forEach(t => t.className = "py-1.5 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex flex-col items-center gap-1");
      [modeReader, modeCamera, modeBrowse].forEach(m => m.classList.add('hidden'));

      if (mode === 'reader') {
        tabReader.className = "py-1.5 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex flex-col items-center gap-1";
        modeReader.classList.remove('hidden');
        stopCamera();
      } else if (mode === 'camera') {
        tabCamera.className = "py-1.5 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex flex-col items-center gap-1";
        modeCamera.classList.remove('hidden');
      } else {
        tabBrowse.className = "py-1.5 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex flex-col items-center gap-1";
        modeBrowse.classList.remove('hidden');
        stopCamera();
      }
    }

    async function readSmartCardHardware(options = {}) {
      const ocrStatus = document.getElementById('ocrStatus');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      const statusSpinner = document.getElementById('statusSpinner');

      activeSmartCardSession = false;
      clearFormInputs();
      
      // แสดงสถานะหมุนอ่านบน Mini Bar
      setMiniReadingState(true);

      ocrStatus.classList.remove('hidden');
      statusSpinner.classList.remove('hidden');
      progressBar.style.width = '30%';
      statusText.innerText = "กำลังตรวจสอบการเชื่อมต่อ...";

      if (window.AndroidInterface && window.AndroidInterface.readSmartCard) {
        window.AndroidInterface.readSmartCard();
        progressBar.style.width = '100%';
        statusText.innerText = "กำลังดึงข้อมูลชิปการ์ด...";
        return;
      }

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        const res = await fetch('http://127.0.0.1:8181/read-card', { method: 'GET', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);

        const data = await res.json();
        if (!res.ok || data.status !== 'success') throw new Error(data.message || 'อ่านบัตรไม่สำเร็จ');

        const source = /Android/i.test(navigator.userAgent) ? "MKT SmartCard Agent (Android)" : "MKT SmartCard Agent (Windows)";
        fillFormData(data.idCard, data.fullName, data.dob, data.address, data.photoBase64, source);
        startCardRemovalWatch();

        // เมื่ออ่านสำเร็จ อัปเดต Status และกางฟอร์มออกดูข้อมูลทันที
        statusSpinner.classList.add('hidden');
        progressBar.style.width = '100%';
        statusText.innerText = "อ่านข้อมูลจากบัตรสำเร็จ";
        
        setMiniReadingState(false);
        expandWidget();
        return;
      } catch (e) {
        console.error("Local agent error", e);
        progressBar.style.width = '100%';
        statusSpinner.classList.add('hidden');
        statusText.innerText = "ไม่พบ MKT SmartCard Agent กรุณาตรวจสอบการเชื่อมต่อ";
        setMiniReadingState(false);
        expandWidget();
        return;
      }
    }

    async function startCamera(selectedDeviceId = '') {
      try {
        if (videoStream) videoStream.getTracks().forEach(track => track.stop());
        if (!selectedDeviceId) selectedDeviceId = localStorage.getItem('mktPreferredCameraId') || '';
        const cameraConstraints = { width: { ideal: 3840 }, height: { ideal: 2160 }, focusMode: { ideal: "continuous" } };
        if (selectedDeviceId) {
          videoStream = await navigator.mediaDevices.getUserMedia({ video: { ...cameraConstraints, deviceId: { exact: selectedDeviceId } } });
        } else {
          try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { ...cameraConstraints, facingMode: { exact: "environment" } } });
          } catch (_) {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { ...cameraConstraints, facingMode: { ideal: "environment" } } });
          }
        }
        const video = document.getElementById('webcam');
        video.srcObject = videoStream;
        await video.play();
        video.onclick = focusCamera;
        const track = videoStream.getVideoTracks()[0];
        try { track.contentHint = 'detail'; } catch (_) {}
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        const advanced = [];
        if (caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({ focusMode: 'continuous' });
        if (caps.zoom) {
          const preferredZoom = caps.zoom.min;
          advanced.push({ zoom: preferredZoom });
          const slider = document.getElementById('zoomSlider');
          slider.min = caps.zoom.min; slider.max = caps.zoom.max; slider.step = caps.zoom.step || 0.1; slider.value = preferredZoom;
          slider.classList.remove('hidden');
          document.getElementById('zoomText').innerText = `มุมกว้าง ${Number(preferredZoom).toFixed(1)}×`;
        }
        if (advanced.length) await track.applyConstraints({ advanced });
        video.classList.remove('hidden');
        document.getElementById('cardGuide').classList.remove('hidden');
        document.getElementById('cardGuide').classList.add('flex');
        document.getElementById('startState').classList.add('hidden');
        document.getElementById('cameraControls').classList.remove('hidden');
        document.getElementById('snapBtn').classList.remove('hidden');
        requestAnimationFrame(() => {
          fitCardGuideToVideo();
          positionSnapButtonNearGuide();
          startCameraQualityMonitor();
        });
      } catch (err) { alert("ไม่สามารถเปิดกล้องหลังได้"); }
    }

    async function focusCamera() {
      const track = videoStream && videoStream.getVideoTracks()[0];
      if (!track) return;
      try {
        document.getElementById('focusText').innerText = 'กำลัง Focus...';
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.focusMode && caps.focusMode.includes('single-shot')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          setTimeout(() => track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}), 700);
        }
        setTimeout(() => { document.getElementById('focusText').innerText = 'Focus แล้ว'; }, 650);
      } catch (_) {}
    }

      document.getElementById('webcam').classList.add('hidden');

    function fitCardGuideToVideo() {
      const video = document.getElementById('webcam');
      const guide = document.getElementById('cardGuideFrame');
      if (!video || !guide || !video.clientWidth || !video.clientHeight) return;
      const ratio = 1.586;
      const width = Math.floor(Math.min(video.clientWidth * 0.95, video.clientHeight * 0.94 * ratio));
      guide.style.width = `${Math.max(220, width)}px`;
    }

    function positionSnapButtonNearGuide() {
      const area = document.getElementById('cameraArea');
      const guide = document.getElementById('cardGuideFrame');
      const button = document.getElementById('snapBtn');
      if (!area || !guide || !button || button.classList.contains('hidden')) return;
      const areaRect = area.getBoundingClientRect();
      const guideRect = guide.getBoundingClientRect();
      const below = guideRect.bottom - areaRect.top + 9;
      const maximum = area.clientHeight - button.offsetHeight - 6;
      button.style.top = `${below <= maximum ? below : Math.max(6, guideRect.bottom - areaRect.top - button.offsetHeight - 8)}px`;
      button.style.left = '50%';
      button.style.bottom = 'auto';
      button.style.transform = 'translateX(-50%)';
    }

    window.addEventListener('resize', () => {
      if (videoStream) {
        fitCardGuideToVideo();
        positionSnapButtonNearGuide();
      }
    });

    function drawCardGuideCrop(source, sourceWidth, sourceHeight, canvas) {
      const ctx = canvas.getContext('2d');
      const ratio = 1.586;
      const videoRect = source.getBoundingClientRect();
      const guideRect = document.getElementById('cardGuideFrame').getBoundingClientRect();

      const scaleX = sourceWidth / Math.max(1, videoRect.width);
      const scaleY = sourceHeight / Math.max(1, videoRect.height);
      let sx = Math.round((guideRect.left - videoRect.left) * scaleX);
      let sy = Math.round((guideRect.top - videoRect.top) * scaleY);
      let sw = Math.round(guideRect.width * scaleX);
      let sh = Math.round(guideRect.height * scaleY);

      sx = Math.max(0, Math.min(sourceWidth - 1, sx));
      sy = Math.max(0, Math.min(sourceHeight - 1, sy));
      sw = Math.max(1, Math.min(sourceWidth - sx, sw));
      sh = Math.max(1, Math.min(sourceHeight - sy, sh));

      if (sw / sh > ratio) sw = Math.floor(sh * ratio);
      else sh = Math.floor(sw / ratio);
      canvas.width = sw;
      canvas.height = sh;
      ctx.drawImage(source, sx, sy, sw, sh, 0, 0, sw, sh);
    }

    function drawGuideQualitySample(video, canvas) {
      const videoRect = video.getBoundingClientRect();
      const guideRect = document.getElementById('cardGuideFrame').getBoundingClientRect();
      const scaleX = video.videoWidth / Math.max(1, videoRect.width);
      const scaleY = video.videoHeight / Math.max(1, videoRect.height);
      const sx = Math.max(0, Math.round((guideRect.left - videoRect.left) * scaleX));
      const sy = Math.max(0, Math.round((guideRect.top - videoRect.top) * scaleY));
      const sw = Math.min(video.videoWidth - sx, Math.round(guideRect.width * scaleX));
      const sh = Math.min(video.videoHeight - sy, Math.round(guideRect.height * scaleY));
      canvas.width = 360;
      canvas.height = Math.round(canvas.width / 1.586);
      canvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    }

    function estimateSharpness(canvas) {
      const sample = document.createElement('canvas');
      const targetWidth = Math.min(420, canvas.width);
      sample.width = targetWidth;
      sample.height = Math.max(1, Math.round(canvas.height * targetWidth / canvas.width));
      const ctx = sample.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(canvas, 0, 0, sample.width, sample.height);
      const pixels = ctx.getImageData(0, 0, sample.width, sample.height).data;
      let score = 0;
      for (let y = 1; y < sample.height - 1; y += 2) {
        for (let x = 1; x < sample.width - 1; x += 2) {
          const i = (y * sample.width + x) * 4;
          const right = i + 4;
          const below = i + sample.width * 4;
          const centerGray = pixels[i] * 0.299 + pixels[i + 1] * 0.587 + pixels[i + 2] * 0.114;
          const rightGray = pixels[right] * 0.299 + pixels[right + 1] * 0.587 + pixels[right + 2] * 0.114;
          const belowGray = pixels[below] * 0.299 + pixels[below + 1] * 0.587 + pixels[below + 2] * 0.114;
          score += Math.abs(centerGray - rightGray) + Math.abs(centerGray - belowGray);
        }
      }
      return score;
    }

    function analyzeCameraQuality(canvas) {
      const sample = document.createElement('canvas');
      sample.width = 180;
      sample.height = Math.max(1, Math.round(canvas.height * sample.width / canvas.width));
      const ctx = sample.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(canvas, 0, 0, sample.width, sample.height);
      const pixels = ctx.getImageData(0, 0, sample.width, sample.height).data;
      const gray = new Uint8Array(sample.width * sample.height);
      let brightness = 0;
      let glare = 0;
      for (let p = 0, i = 0; i < pixels.length; i += 4, p++) {
        const value = Math.round(pixels[i] * 0.299 + pixels[i + 1] * 0.587 + pixels[i + 2] * 0.114);
        gray[p] = value;
        brightness += value;
        if (value > 247 && Math.max(pixels[i], pixels[i + 1], pixels[i + 2]) - Math.min(pixels[i], pixels[i + 1], pixels[i + 2]) < 10) glare++;
      }
      let sharpness = 0;
      let comparisons = 0;
      for (let y = 1; y < sample.height - 1; y += 2) {
        for (let x = 1; x < sample.width - 1; x += 2) {
          const p = y * sample.width + x;
          sharpness += Math.abs(gray[p] - gray[p + 1]) + Math.abs(gray[p] - gray[p + sample.width]);
          comparisons += 2;
        }
      }
      let motion = 0;
      if (previousQualityFrame && previousQualityFrame.length === gray.length) {
        for (let p = 0; p < gray.length; p += 4) motion += Math.abs(gray[p] - previousQualityFrame[p]);
        motion /= Math.ceil(gray.length / 4);
      }
      previousQualityFrame = gray;
      return {
        brightness: brightness / gray.length,
        glare: glare / gray.length,
        sharpness: sharpness / Math.max(1, comparisons),
        motion
      };
    }

    function updateCameraAssist() {
      const video = document.getElementById('webcam');
      if (!videoStream || !video.videoWidth || video.classList.contains('hidden')) return;
      const frame = document.createElement('canvas');
      drawGuideQualitySample(video, frame);
      const quality = analyzeCameraQuality(frame);
      cameraQualitySamples++;
      bestObservedSharpness = Math.max(bestObservedSharpness * 0.995, quality.sharpness);

      let ready = false;
      let message = 'กำลังตรวจ Focus...';
      if (quality.brightness < 58) message = 'แสงน้อย • เพิ่มแสง';
      else if (quality.glare > 0.16) message = 'มีแสงสะท้อน';
      else if (cameraQualitySamples > 2 && quality.motion > 14) message = 'ภาพกำลังสั่น';
      else if (cameraQualitySamples < 3 || quality.sharpness < Math.max(4.5, bestObservedSharpness * 0.72)) message = 'กำลัง Focus...';
      else {
        ready = true;
        message = 'พร้อมถ่าย';
      }

      const guide = document.getElementById('cardGuideFrame');
      const hint = document.getElementById('cameraHint');
      const button = document.getElementById('snapBtn');
      guide.style.borderColor = ready ? '#22c55e' : '#ffffff';
      guide.style.boxShadow = ready ? '0 0 0 999px rgba(0,0,0,.28), 0 0 18px rgba(34,197,94,.9)' : '0 0 0 999px rgba(0,0,0,.28)';
      hint.innerText = message;
      document.getElementById('focusText').innerText = message;
      button.style.backgroundColor = ready ? '#16a34a' : '#dc2626';
    }

    function startCameraQualityMonitor() {
      stopCameraQualityMonitor();
      previousQualityFrame = null;
      bestObservedSharpness = 0;
      cameraQualitySamples = 0;
      cameraQualityTimer = setInterval(updateCameraAssist, 450);
    }

    function stopCameraQualityMonitor() {
      if (cameraQualityTimer) clearInterval(cameraQualityTimer);
      cameraQualityTimer = null;
      previousQualityFrame = null;
    }

    async function captureBestFocusedFrame(video, outputCanvas) {
      let bestCanvas = null;
      let bestScore = -1;
      for (let attempt = 0; attempt < 3; attempt++) {
        if (attempt) await new Promise(resolve => setTimeout(resolve, 180));
        const candidate = document.createElement('canvas');
        drawCardGuideCrop(video, video.videoWidth || 1920, video.videoHeight || 1080, candidate);
        const score = estimateSharpness(candidate);
        if (score > bestScore) {
          bestScore = score;
          bestCanvas = candidate;
        }
      }
      outputCanvas.width = bestCanvas.width;
      outputCanvas.height = bestCanvas.height;
      outputCanvas.getContext('2d').drawImage(bestCanvas, 0, 0);
    }

    async function takeSnapshot() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('cropCanvas');
      const button = document.getElementById('snapBtn');
      button.disabled = true;
      document.getElementById('focusText').innerText = 'กำลัง Focus...';
      await focusCamera();
      await new Promise(resolve => setTimeout(resolve, 900));
      await captureBestFocusedFrame(video, canvas);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      stopCamera();
      button.disabled = false;
      processCardImage(canvas, dataUrl, 'camera');
    }

    function prepareCardCanvas(sourceCanvas) {
      const ratio = 1.586;
      const srcW = sourceCanvas.width;
      const srcH = sourceCanvas.height;
      const out = document.createElement('canvas');
      out.width = 1900;
      out.height = Math.round(out.width / ratio);
      const outCtx = out.getContext('2d', { willReadFrequently: true });
      outCtx.imageSmoothingEnabled = true;
      outCtx.imageSmoothingQuality = 'high';
      outCtx.drawImage(sourceCanvas, 0, 0, srcW, srcH, 0, 0, out.width, out.height);
      return out;
    }

    function cropIsolatedNameCanvas(fullCanvas) {
      const w = fullCanvas.width;
      const h = fullCanvas.height;
      const nameCanvas = document.getElementById('isolatedNameCanvas');
      const ctx = nameCanvas.getContext('2d', { willReadFrequently: true });

      const nx = Math.floor(w * 0.245);
      const ny = Math.floor(h * 0.175);
      const nw = Math.floor(w * 0.46);
      const nh = Math.floor(h * 0.12);

      nameCanvas.width = nw * 2;
      nameCanvas.height = nh * 2;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(fullCanvas, nx, ny, nw, nh, 0, 0, nameCanvas.width, nameCanvas.height);
      return enhanceOcrCanvas(nameCanvas);
    }

    function cropCameraNameBand(fullCanvas) {
      return enhanceOcrCanvas(cropRegionCanvas(fullCanvas, 0.12, 0.13, 0.64, 0.21, 3));
    }

    function enhanceOcrCanvas(sourceCanvas) {
      const out = document.createElement('canvas');
      out.width = sourceCanvas.width;
      out.height = sourceCanvas.height;
      const ctx = out.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(sourceCanvas, 0, 0);
      const image = ctx.getImageData(0, 0, out.width, out.height);
      const data = image.data;
      for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        const contrasted = Math.max(0, Math.min(255, (gray - 128) * 1.15 + 128));
        data[i] = data[i + 1] = data[i + 2] = contrasted;
      }
      ctx.putImageData(image, 0, 0);
      return out;
    }

    function cropRegionCanvas(fullCanvas, x, y, width, height, scale = 2) {
      const out = document.createElement('canvas');
      const sx = Math.max(0, Math.floor(fullCanvas.width * x));
      const sy = Math.max(0, Math.floor(fullCanvas.height * y));
      const sw = Math.min(fullCanvas.width - sx, Math.floor(fullCanvas.width * width));
      const sh = Math.min(fullCanvas.height - sy, Math.floor(fullCanvas.height * height));
      out.width = Math.max(1, sw * scale);
      out.height = Math.max(1, sh * scale);
      const ctx = out.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(fullCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
      return out;
    }

    function normalizeThaiOcr(text) {
      return text
        .replace(/[|]/g, ' ')
        .replace(/[“”„]/g, '"')
        .replace(/กรุงเทพ\s*มหานคร/g, 'กรุงเทพมหานคร')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function isValidThaiID(value) {
      const d = value.replace(/\D/g, '');
      if (d.length !== 13) return false;
      let sum = 0;
      for (let i = 0; i < 12; i++) sum += Number(d[i]) * (13 - i);
      const checkDigit = (11 - (sum % 11)) % 10;
      return checkDigit === Number(d[12]);
    }

    function extractThaiID(text) {
      const lines = text.split('\n').map(normalizeThaiOcr).filter(Boolean);
      const prioritized = [
        ...lines.filter(v => /(เลขประจำตัว|Identification|ประจำตัวประชาชน)/i.test(v)),
        ...lines.filter(v => !/(เลขประจำตัว|Identification|ประจำตัวประชาชน)/i.test(v))
      ];
      for (const line of prioritized) {
        const candidates = line.match(/(?<!\d)(?:\d[\s-]*){13}(?!\d)/g) || [];
        for (const candidate of candidates) {
          const digits = candidate.replace(/\D/g, '');
          if (/^[1-8]/.test(digits) && isValidThaiID(digits)) return digits;
        }
      }
      return '';
    }

    function extractNameUltimate(text) {
      const lines = text.split('\n').map(normalizeThaiOcr).filter(Boolean);

      for (let line of lines) {
        let match = line.match(/(นาย|นางสาว|นาง|เด็กชาย|เด็กหญิง|ดร\.|พ\.ต\.|ร\.ต\.)\s*([ก-๙]{2,}\s+[ก-๙]{2,})/);
        if (match) {
          return `${match[1]} ${match[2]}`.trim();
        }
      }

      for (let line of lines) {
        if (/(นาย|นางสาว|นาง|เด็กชาย|เด็กหญิง|ดร\.|พ\.ต\.|ร\.ต\.)/.test(line)) {
          let cleaned = line.replace(/.*?(นาย|นางสาว|นาง|เด็กชาย|เด็กหญิง|ดร\.|พ\.ต\.|ร\.ต\.)/, '$1')
                            .replace(/(เกิดวันที่|Date of Birth|Identification|เลขประจำตัว|Name|Last name|\b\d{1,2}\b).*$/gi, '')
                            .replace(/[)\(\]\[}""'""-]+$/, '')
                            .trim();
          if (cleaned.length >= 4 && /[ก-๙]/.test(cleaned)) return cleaned;
        }
      }

      for (let line of lines) {
        let thaiWords = line.match(/[ก-๙]{3,}\s+[ก-๙]{3,}/g);
        if (thaiWords && thaiWords.length > 0 && !/(ที่อยู่|ประจำตัว|ศาสนา|บัตร|เกิดวันที่)/.test(line)) {
          return thaiWords[0].trim();
        }
      }

      return '';
    }

    function extractRecognizedThaiTitle(text) {
      const compact = normalizeThaiOcr(text).replace(/\s+/g, '');
      for (const title of ['เด็กหญิง', 'เด็กชาย', 'นางสาว', 'นาย', 'นาง']) {
        if (compact.includes(title)) return title;
      }
      return '';
    }

    function combineRecognizedTitle(name, nameZoneText) {
      const cleanName = normalizeThaiOcr(name || '');
      if (!cleanName) return '';
      if (/^(เด็กชาย|เด็กหญิง|นาย|นางสาว|นาง)\s*/.test(cleanName)) return cleanName;
      const title = extractRecognizedThaiTitle(nameZoneText || '');
      return title ? `${title} ${cleanName}` : cleanName;
    }

    function isCompleteThaiName(value) {
      return /^(?:เด็กชาย|เด็กหญิง|นาย|นางสาว|นาง)\s+[ก-๙]{2,}\s+[ก-๙]{2,}(?:\s+[ก-๙]{2,})?$/.test(normalizeThaiOcr(value || ''));
    }

    function isValidDobResult(value) {
      const match = normalizeThaiOcr(value || '').match(/^(\d{1,2})\s+[ก-๙.]+\s+(\d{4})$/);
      if (!match) return false;
      const day = Number(match[1]);
      const year = Number(match[2]);
      return day >= 1 && day <= 31 && year >= 2400 && year <= 2600;
    }

    function isPlausibleThaiAddress(value) {
      const clean = normalizeThaiOcr(value || '');
      const hasHouse = /\d+\s*\/\s*\d+|(?:^|\s)\d{1,4}(?:\s|$)/.test(clean);
      const hasArea = /(แขวง|เขต|ตำบล|อำเภอ|จังหวัด|กรุงเทพมหานคร)/.test(clean);
      return clean.length >= 12 && hasHouse && hasArea;
    }

    function extractDobSmart(fullText) {
      const months = {
        'ม.ค.':'มกราคม','มกราคม':'มกราคม','ก.พ.':'กุมภาพันธ์','กุมภาพันธ์':'กุมภาพันธ์',
        'มี.ค.':'มีนาคม','มีนาคม':'มีนาคม','เม.ย.':'เมษายน','เมษายน':'เมษายน',
        'พ.ค.':'พฤษภาคม','พฤษภาคม':'พฤษภาคม','มิ.ย.':'มิถุนายน','มิถุนายน':'มิถุนายน',
        'ก.ค.':'กรกฎาคม','กรกฎาคม':'กรกฎาคม','ส.ค.':'สิงหาคม','สิงหาคม':'สิงหาคม',
        'ก.ย.':'กันยายน','กันยายน':'กันยายน','ต.ค.':'ตุลาคม','ตุลาคม':'ตุลาคม',
        'พ.ย.':'พฤศจิกายน','พฤศจิกายน':'พฤศจิกายน','ธ.ค.':'ธันวาคม','ธันวาคม':'ธันวาคม'
      };
      const monthPattern = Object.keys(months).sort((a,b) => b.length-a.length).map(v => v.replace(/\./g, '\\.')).join('|');
      const labelled = fullText.match(new RegExp('(?:เกิดวันที่|วันเกิด|Date of Birth)\\s*[:：-]?\\s*(\\d{1,2})\\s*(' + monthPattern + ')\\s*(\\d{4})', 'i'));
      if (labelled) return `${Number(labelled[1])} ${months[labelled[2]] || labelled[2]} ${labelled[3]}`;
      const fallback = fullText.match(new RegExp('(?:^|\\n|\\s)(\\d{1,2})\\s*(' + monthPattern + ')\\s*(24\\d{2}|25\\d{2})(?:$|\\n|\\s)', 'i'));
      if (fallback) return `${Number(fallback[1])} ${months[fallback[2]] || fallback[2]} ${fallback[3]}`;
      return '';
    }

    function extractCameraDob(text) {
      const thaiResult = extractDobSmart(text);
      if (thaiResult) return thaiResult;
      const englishMonths = {
        jan: 'มกราคม', feb: 'กุมภาพันธ์', mar: 'มีนาคม', apr: 'เมษายน',
        may: 'พฤษภาคม', jun: 'มิถุนายน', jul: 'กรกฎาคม', aug: 'สิงหาคม',
        sep: 'กันยายน', oct: 'ตุลาคม', nov: 'พฤศจิกายน', dec: 'ธันวาคม'
      };
      const match = normalizeThaiOcr(text || '').match(/(?:Date\s*of\s*Birth\s*)?(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+(19\d{2}|20\d{2})/i);
      if (!match) return '';
      return `${Number(match[1])} ${englishMonths[match[2].toLowerCase()]} ${Number(match[3]) + 543}`;
    }

    function cleanCameraAddress(value) {
      return normalizeThaiOcr(value || '')
        .replace(/\s*[\/|]+\s*/g, ' ')
        .replace(/(กรุงเทพมหานคร).*$/, '$1')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function extractAddressV1037(lines) {
      const start = lines.findIndex(v => /ที่อยู่/.test(v));
      const selected = [];
      for (let i = Math.max(0, start); i < lines.length; i++) {
        let line = lines[i];
        if (i > start && /(วันออกบัตร|วันบัตรหมดอายุ|Date of Issue|Date of Expiry|เจ้าพนักงาน)/i.test(line)) break;
        if (start < 0 && !/(\d+\/\d+|หมู่|ซอย|ถนน|แขวง|เขต|ตำบล|อำเภอ|จังหวัด|กรุงเทพ)/.test(line)) continue;

        line = line.replace(/^.*?ที่อยู่\s*[:：-]?\s*/, '')
          .replace(/^[%\#@$&*._\-\s]+/, '')
          .replace(/ศาสนา\s*(พุทธ|คริสต์|อิสลาม)?/g, '')
          .replace(/(?:วันออกบัตร|วันบัตรหมดอายุ).*$/i, '')
          .replace(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}.*$/, '')
          .replace(/[A-Za-z_<>|="']+/g, ' ')
          .replace(/\s+/g, ' ').trim();

        if (line.length > 2) selected.push(line);
      }
      let fullAddress = selected.join(' ').replace(/\s+/g, ' ').trim();
      fullAddress = fullAddress.replace(/\s*[-—–_]\s*/g, ' ');
      fullAddress = fullAddress.replace(/กรุงเท\S*/g, 'กรุงเทพมหานคร');
      fullAddress = fullAddress.replace(/\s+[๐-๙0-9]{1,3}\s+[๐-๙0-9]{1,3}$/, '');
      fullAddress = fullAddress.replace(/^[%\s\W]*บ\s*([0-9]+)/i, '1/$1');
      fullAddress = fullAddress.replace(/^[^0-9]*([0-9]+\/[0-9]+)/, '$1');
      return fullAddress;
    }

    async function getOcrWorker(logger) {
      if (!ocrWorkerPromise) {
        ocrWorkerPromise = Tesseract.createWorker(['tha', 'eng'], 1, { logger })
          .catch(error => { ocrWorkerPromise = null; throw error; });
      }
      return ocrWorkerPromise;
    }

    async function processCardImage(fullCanvas, dataUrl, inputMode = 'browse') {
      const ocrStatus = document.getElementById('ocrStatus');
      const cardPreview = document.getElementById('cardPreview');
      const cardIcon = document.getElementById('cardIcon');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      const statusSpinner = document.getElementById('statusSpinner');

      activeSmartCardSession = false;
      clearFormInputs();

      ocrStatus.classList.remove('hidden');
      cardIcon.classList.add('hidden');
      cardPreview.src = dataUrl;
      cardPreview.classList.remove('hidden');
      statusSpinner.classList.remove('hidden');
      progressBar.style.width = '20%';

      try {
        statusText.innerText = "กำลังประมวลผล OCR...";
        cropFaceFromCanvas(fullCanvas);

        const preparedCanvas = prepareCardCanvas(fullCanvas);
        const fullCardDataUrl = preparedCanvas.toDataURL('image/png');

        progressBar.style.width = '40%';

        const worker = await getOcrWorker(m => {
          if (m.status === 'recognizing text') {
            progressBar.style.width = `${40 + Math.round((m.progress || 0) * 50)}%`;
            statusText.innerText = `อ่านข้อมูล ${Math.round((m.progress || 0) * 100)}%`;
          }
        });

        await worker.setParameters({
          preserve_interword_spaces: '1',
          user_defined_dpi: '300',
          tessedit_pageseg_mode: '6'
        });

        const fullCardRes = await worker.recognize(fullCardDataUrl);
        const fullText = fullCardRes.data.text || '';
        const fullLines = fullText.split('\n').map(normalizeThaiOcr).filter(Boolean);
        const idDigits = extractThaiID(fullText);
        let extractedDOB = extractDobSmart(fullText);
        let extractedAddress = extractAddressV1037(fullLines);

        progressBar.style.width = '72%';
        const nameDataUrl = cropIsolatedNameCanvas(preparedCanvas).toDataURL('image/png');
        await worker.setParameters({
          preserve_interword_spaces: '1',
          user_defined_dpi: '300',
          tessedit_pageseg_mode: '7'
        });
        const nameRes = await worker.recognize(nameDataUrl);
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const narrowText = nameRes.data.text || '';
        const narrowName = extractNameUltimate(narrowText);
        let extractedName = combineRecognizedTitle(narrowName, narrowText);
        let fieldConfidence = nameRes.data.confidence || 0;

        if (inputMode === 'camera' && !isCompleteThaiName(extractedName)) {
          progressBar.style.width = '76%';
          const wideNameCanvas = cropCameraNameBand(preparedCanvas);
          await worker.setParameters({
            preserve_interword_spaces: '1',
            user_defined_dpi: '300',
            tessedit_pageseg_mode: '6'
          });
          const wideNameRes = await worker.recognize(wideNameCanvas.toDataURL('image/png'));
          const wideNameText = wideNameRes.data.text || '';
          const wideName = combineRecognizedTitle(extractNameUltimate(wideNameText), wideNameText);
          if (isCompleteThaiName(wideName)) extractedName = wideName;
          fieldConfidence = Math.max(fieldConfidence, wideNameRes.data.confidence || 0);
        } else if (inputMode !== 'camera' && !extractedName) {
          extractedName = combineRecognizedTitle(extractNameUltimate(fullText), narrowText);
        }

        if (inputMode === 'camera') {
          progressBar.style.width = '78%';
          const dobCanvas = enhanceOcrCanvas(cropRegionCanvas(preparedCanvas, 0.27, 0.35, 0.48, 0.20, 2));
          await worker.setParameters({
            preserve_interword_spaces: '1',
            user_defined_dpi: '300',
            tessedit_pageseg_mode: '6'
          });
          const dobRes = await worker.recognize(dobCanvas.toDataURL('image/png'));
          extractedDOB = extractCameraDob(dobRes.data.text || '');

          progressBar.style.width = '84%';
          const addressCanvas = enhanceOcrCanvas(cropRegionCanvas(preparedCanvas, 0.04, 0.56, 0.68, 0.25, 2));
          const addressRes = await worker.recognize(addressCanvas.toDataURL('image/png'));
          const addressText = addressRes.data.text || '';
          const addressLines = (`ที่อยู่ ${addressText}`).split('\n').map(normalizeThaiOcr).filter(Boolean);
          extractedAddress = cleanCameraAddress(extractAddressV1037(addressLines));
        }

        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const confidence = Math.round(((fullCardRes.data.confidence || 0) + fieldConfidence) / 2);

        progressBar.style.width = '100%';
        statusSpinner.classList.add('hidden');

        const extractedID = idDigits ? formatIDCard(idDigits) : '';

        fillFormData(extractedID, extractedName, extractedDOB, extractedAddress, null, `V10.50 (${confidence}%)`);

        const issues = [];
        if (!idDigits || !isValidThaiID(idDigits)) issues.push('เลขบัตรไม่ผ่าน Checksum');
        if (!isCompleteThaiName(extractedName)) issues.push('ชื่อไม่ครบถ้วน');

        statusText.innerText = issues.length ? `ตรวจสอบ: ${issues.join(', ')}` : `สแกนข้อมูลเรียบร้อยแล้ว`;

        const badge = document.getElementById('ocrBadge');
        badge.classList.remove('hidden');
        badge.innerText = issues.length ? 'OCR ต้องตรวจสอบ' : 'OCR สมบูรณ์';

        expandWidget();

      } catch (err) {
        console.error(err);
        statusSpinner.classList.add('hidden');
        statusText.innerText = "สแกนภาพไม่สำเร็จ";
      }
    }

    function fillFormData(id, name, dob, address, photoBase64, sourceText) {
      document.getElementById('idCard').value = id || "";
      document.getElementById('fullName').value = name || "";
      document.getElementById('dob').value = dob || "";
      document.getElementById('address').value = address || "";

      if (photoBase64) {
        document.getElementById('facePreview').src = photoBase64.startsWith('data:') ? photoBase64 : "data:image/jpeg;base64," + photoBase64;
        document.getElementById('facePreview').classList.remove('hidden');
        document.getElementById('facePlaceholder').classList.add('hidden');
      }
      document.getElementById('sourceLabel').innerText = "แหล่งข้อมูล: " + sourceText;
    }

    function formatIDCard(id) {
      if(id.length !== 13) return id;
      return `${id[0]}-${id.substring(1,5)}-${id.substring(5,10)}-${id.substring(10,12)}-${id.substring(12)}`;
    }

    function handleSubmit(e) {
      e.preventDefault();
      const idVal = document.getElementById('idCard').value.replace(/\D/g, '');
      if (!isValidThaiID(idVal)) {
        alert('เลขบัตรประจำตัวประชาชนไม่ผ่านการตรวจสอบ Checksum!');
        return;
      }
      alert("บันทึกข้อมูลการลงทะเบียนเรียบร้อยแล้ว!");
      
      // บันทึกเสร็จแล้ว ย่อกลับเป็นไอคอนจิ๋วอัตโนมัติ
      minimizeWidget();
    }

    function clearOcrImageAndData() {
      clearFormInputs();
      const preview = document.getElementById('cardPreview');
      preview.removeAttribute('src');
      preview.classList.add('hidden');
      document.getElementById('cardIcon').classList.remove('hidden');
      ['cropCanvas', 'faceCanvas', 'isolatedNameCanvas'].forEach(id => {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.width = 1;
        canvas.height = 1;
      });
      const fileInput = document.getElementById('fileInput');
      if (fileInput) fileInput.value = '';
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('statusText').innerText = 'ล้างข้อมูลแล้ว';
      document.getElementById('sourceLabel').innerText = 'ยังไม่มีข้อมูลผู้ป่วย';
    }
  </script>
