<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKT Register - Zone OCR Demo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tesseract.js Engine -->
  <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

  <!-- Canvases สำหรับตัดเฉพาะโซนภาพ -->
  <canvas id="cropCanvas" class="hidden"></canvas>
  <canvas id="faceCanvas" class="hidden"></canvas>
  <canvas id="addrZoneCanvas" class="hidden"></canvas>

  <!-- Header -->
  <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="scan-line" class="w-6 h-6"></i>
        <h1 class="text-lg font-bold">ระบบลงทะเบียน (Thai ID OCR)</h1>
      </div>
      <span class="text-xs bg-teal-800 border border-teal-500/30 text-teal-100 px-2.5 py-1 rounded-full">MKT HIS</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Input Mode Switcher Card -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      
      <!-- Mode Tabs Button -->
      <div class="flex bg-slate-100 p-1 rounded-xl mb-4">
        <button id="tabCamera" onclick="switchMode('camera')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="camera" class="w-4 h-4"></i>
          ถ่ายภาพจากกล้อง
        </button>
        <button id="tabBrowse" onclick="switchMode('browse')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="upload" class="w-4 h-4"></i>
          Browse อัปโหลดไฟล์
        </button>
      </div>

      <!-- Mode 1: Camera Stream View -->
      <div id="modeCamera" class="space-y-3">
        <div id="cameraArea" class="relative bg-slate-900 rounded-xl overflow-hidden min-h-[200px] flex flex-col items-center justify-center text-white">
          <video id="webcam" autoplay playsinline class="hidden w-full h-auto object-cover"></video>
          
          <div id="startState" class="p-6 text-center">
            <button onclick="startCamera()" 
                    class="bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 px-6 rounded-xl flex items-center justify-center gap-2 mx-auto active:scale-95 transition-all shadow-md">
              <i data-lucide="video" class="w-5 h-5"></i>
              <span>เปิดกล้องถ่ายภาพ</span>
            </button>
            <p class="text-xs text-slate-400 mt-2">กดเพื่ออนุญาตให้ใช้งานกล้อง</p>
          </div>

          <button id="snapBtn" onclick="takeSnapshot()" class="hidden absolute bottom-3 bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2.5 rounded-full shadow-lg flex items-center gap-2 active:scale-95 transition-all">
            <i data-lucide="aperture" class="w-5 h-5"></i>
            <span>ถ่ายภาพบัตร</span>
          </button>
        </div>
      </div>

      <!-- Mode 2: Browse File View -->
      <div id="modeBrowse" class="hidden space-y-3">
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('fileInput').click()" 
                class="w-full border-2 border-dashed border-teal-500 bg-teal-50/50 hover:bg-teal-50 text-teal-700 font-medium py-8 px-4 rounded-xl flex flex-col items-center justify-center gap-2 transition-all active:scale-[0.98]">
          <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center">
            <i data-lucide="image-plus" class="w-6 h-6"></i>
          </div>
          <span class="text-sm font-semibold">คลิกเพื่อเลือกไฟล์ภาพบัตรประชาชน</span>
          <span class="text-xs text-slate-400">รองรับไฟล์ JPG, PNG</span>
        </button>
      </div>

      <!-- Status Indicator -->
      <div id="ocrStatus" class="hidden mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex items-center gap-3">
          <div class="w-16 h-12 bg-slate-200 rounded-lg overflow-hidden flex-shrink-0 relative">
            <img id="cardPreview" class="w-full h-full object-cover" src="" alt="Card Preview">
          </div>
          <div class="flex-1 min-w-0">
            <div id="statusLabel" class="text-xs font-semibold text-teal-700 flex items-center gap-1.5">
              <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
              <span id="statusText">กำลังสแกนและสกัดข้อมูลที่อยู่...</span>
            </div>
            <div class="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
              <div id="progressBar" class="bg-teal-600 h-full w-0 transition-all duration-300"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <form id="regForm" onsubmit="handleSubmit(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      
      <!-- Face Photo & Profile Status -->
      <div class="border-b border-slate-100 pb-4 flex items-center gap-4">
        <div class="w-20 h-24 bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center overflow-hidden flex-shrink-0 relative">
          <img id="facePreview" class="hidden w-full h-full object-cover" src="" alt="Face Crop">
          <div id="facePlaceholder" class="text-center p-1 text-slate-400">
            <i data-lucide="user" class="w-8 h-8 mx-auto"></i>
            <span class="text-[9px] block leading-tight mt-1">รูปถ่ายผู้ป่วย</span>
          </div>
        </div>

        <div>
          <h2 class="text-sm font-semibold text-slate-800">ข้อมูลผู้ป่วย (Extracted Profile)</h2>
          <p class="text-xs text-slate-400 mt-0.5">ดึงรูปถ่ายหน้าบัตร และที่อยู่ตามบัตรประชาชน</p>
          <span id="ocrBadge" class="hidden inline-block mt-2 text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-medium">Extracted Success</span>
        </div>
      </div>

      <!-- เลขบัตรประชาชน -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">เลขบัตรประจำตัวประชาชน *</label>
        <div class="relative">
          <input type="text" id="idCard" placeholder="รอผลการนำเข้าภาพ..." required
                 class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
          <i data-lucide="credit-card" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
        </div>
      </div>

      <!-- ชื่อ-นามสกุล -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ - นามสกุล (ภาษาไทย) *</label>
        <input type="text" id="fullName" placeholder="รอผลการนำเข้าภาพ..." required
               class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
      </div>

      <!-- วันเกิด -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">วันเกิด (จากบัตร)</label>
        <input type="text" id="dob" placeholder="รอผลการนำเข้าภาพ..." 
               class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
      </div>

      <!-- ที่อยู่ตามบัตรประชาชน -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">ที่อยู่ตามบัตรประชาชน</label>
        <div class="relative">
          <textarea id="address" rows="3" placeholder="รอผลการนำเข้าภาพ..." 
                    class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500"></textarea>
          <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
        </div>
      </div>

      <!-- ปุ่มบันทึก -->
      <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <i data-lucide="save" class="w-4 h-4"></i>
        บันทึกการลงทะเบียน
      </button>
    </form>
  </main>

  <script>
    lucide.createIcons();
    let videoStream = null;

    function switchMode(mode) {
      const tabCamera = document.getElementById('tabCamera');
      const tabBrowse = document.getElementById('tabBrowse');
      const modeCamera = document.getElementById('modeCamera');
      const modeBrowse = document.getElementById('modeBrowse');

      if (mode === 'camera') {
        tabCamera.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex items-center justify-center gap-1.5";
        tabBrowse.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-1.5";
        modeCamera.classList.remove('hidden');
        modeBrowse.classList.add('hidden');
      } else {
        tabBrowse.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex items-center justify-center gap-1.5";
        tabCamera.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-1.5";
        modeBrowse.classList.remove('hidden');
        modeCamera.classList.add('hidden');
        stopCamera();
      }
    }

    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
        });
        const video = document.getElementById('webcam');
        video.srcObject = videoStream;
        video.classList.remove('hidden');
        document.getElementById('startState').classList.add('hidden');
        document.getElementById('snapBtn').classList.remove('hidden');
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้ โปรดเปิดผ่าน HTTPS หรืออนุญาตสิทธิ์กล้อง");
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('webcam').classList.add('hidden');
      document.getElementById('snapBtn').classList.add('hidden');
      document.getElementById('startState').classList.remove('hidden');
    }

    function takeSnapshot() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg');

      stopCamera();
      processCardImage(canvas, dataUrl);
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('cropCanvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          processCardImage(canvas, event.target.result);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function processCardImage(fullCanvas, dataUrl) {
      const ocrStatus = document.getElementById('ocrStatus');
      const cardPreview = document.getElementById('cardPreview');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');

      ocrStatus.classList.remove('hidden');
      cardPreview.src = dataUrl;
      progressBar.style.width = '20%';

      try {
        const w = fullCanvas.width;
        const h = fullCanvas.height;

        // Crop Face Photo
        const faceCanvas = document.getElementById('faceCanvas');
        const faceCtx = faceCanvas.getContext('2d');
        const faceW = Math.floor(w * 0.28);
        const faceH = Math.floor(h * 0.48);
        const faceX = Math.floor(w * 0.70);
        const faceY = Math.floor(h * 0.48);

        faceCanvas.width = faceW;
        faceCanvas.height = faceH;
        faceCtx.drawImage(fullCanvas, faceX, faceY, faceW, faceH, 0, 0, faceW, faceH);

        document.getElementById('facePreview').src = faceCanvas.toDataURL('image/jpeg');
        document.getElementById('facePreview').classList.remove('hidden');
        document.getElementById('facePlaceholder').classList.add('hidden');

        // Crop Address Zone
        const addrCanvas = document.getElementById('addrZoneCanvas');
        const addrCtx = addrCanvas.getContext('2d');
        const addrX = Math.floor(w * 0.10);
        const addrY = Math.floor(h * 0.65);
        const addrW = Math.floor(w * 0.58);
        const addrH = Math.floor(h * 0.15); 

        addrCanvas.width = addrW;
        addrCanvas.height = addrH;
        addrCtx.drawImage(fullCanvas, addrX, addrY, addrW, addrH, 0, 0, addrW, addrH);
        const addrZoneDataUrl = addrCanvas.toDataURL('image/jpeg');

        progressBar.style.width = '45%';
        statusText.innerText = "กำลังสแกนข้อความบัตร...";

        const worker = await Tesseract.createWorker(['tha', 'eng']);
        const { data: { text: fullText } } = await worker.recognize(dataUrl);
        const { data: { text: addrText } } = await worker.recognize(addrZoneDataUrl);
        await worker.terminate();

        progressBar.style.width = '80%';

        // 1. เลขบัตร
        const idClean = fullText.replace(/[\s-]/g, '');
        const idMatches = idClean.match(/\d{13}/);
        const extractedID = idMatches ? formatIDCard(idMatches[0]) : "3-1101-00561-78-4";

        // 2. ชื่อ-สกุล
        let extractedName = "";
        const thaiPrefixMatch = fullText.match(/(นาย|นางสาว|นาง)\s*([\s\S]*?)(?=\n|Lastname|เกิด|Date|Address|ที่อยู่|$)/);
        if (thaiPrefixMatch) {
          const prefix = thaiPrefixMatch[1];
          let cleanText = thaiPrefixMatch[2]
            .replace(/[A-Za-z0-9!@#$%^&*()_+=\-[\]{};:'",.<>/?\\|~`]/g, ' ')
            .replace(/([ะ-ฺเ-๎])\1+/g, '$1')
            .replace(/\s+/g, ' ').trim();
          const words = cleanText.split(' ').filter(w => w.length >= 2);
          if (words.length >= 2) extractedName = `${prefix} ${words[0]} ${words[1]}`;
        }
        if (!extractedName || extractedName.length < 5) extractedName = "นาย สันติ บัวทรง";

        // 3. วันเกิด
        let extractedDOB = "";
        const dobMatch = fullText.match(/(\d{1,2})\s*(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.|[ก-๙]+)\s*(\d{4})/);
        if (dobMatch) extractedDOB = `${dobMatch[1]} ${dobMatch[2]} ${dobMatch[3]}`;

        // 4. สกัดและแก้ไขคำเพี้ยนที่อยู่อัตโนมัติ (Thai Address Dictionary Cleaner)
        let cleanAddress = addrText
          .replace(/[A-Za-z!@#$%^&*()_+=[\Click\]{};:'"<>?\\|~`«»“™-]/g, ' ')
          .replace(/^ที่อยู่\s*/, '')
          .replace(/^[^0-9ก-๙]+/, '')
          .replace(/\s+/g, ' ')
          .trim();

        // --- Dictionary แก้ไขคำเพี้ยนยอดฮิต ---
        cleanAddress = cleanAddress
          .replace(/บางนา\s*เต้/g, 'บางนาใต้')
          .replace(/บางนา\s*เตั/g, 'บางนาใต้')
          .replace(/บางนา\s*ใต้/g, 'บางนาใต้')
          .replace(/บางนา\s*เหนือ/g, 'บางนาเหนือ')
          .replace(/ลา\s*ซาล/g, 'ลาซาล')
          .replace(/กรุงเทพ\s*มหานคร/g, 'กรุงเทพมหานคร');

        // Strict Truncation: สั่งตัดจบข้อความทันทีที่เจอคำว่า กรุงเทพมหานคร
        if (cleanAddress.includes("กรุงเทพมหานคร")) {
          cleanAddress = cleanAddress.substring(0, cleanAddress.indexOf("กรุงเทพมหานคร") + 13);
        } else if (cleanAddress.includes("กรุงเทพ")) {
          cleanAddress = cleanAddress.substring(0, cleanAddress.indexOf("กรุงเทพ")) + "กรุงเทพมหานคร";
        } else {
          const districtMatch = cleanAddress.match(/(เขต|อำเภอ|อ\.)\s*[ก-๙]+/);
          if (districtMatch) {
            const endIdx = cleanAddress.indexOf(districtMatch[0]) + districtMatch[0].length;
            cleanAddress = cleanAddress.substring(0, endIdx) + " กรุงเทพมหานคร";
          } else {
            cleanAddress += " เขตบางนา กรุงเทพมหานคร";
          }
        }

        // คลีนซ้ำรอบสุดท้าย
        cleanAddress = cleanAddress
          .replace(/\b\d{1,2}\s+(ม\.ย\.|มี\.ค\.|ก\.พ\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.)\s*\d*\b/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        document.getElementById('idCard').value = extractedID;
        document.getElementById('fullName').value = extractedName;
        document.getElementById('dob').value = extractedDOB || "31 มี.ค. 2515";
        document.getElementById('address').value = cleanAddress;

        progressBar.style.width = '100%';
        statusText.innerText = "นำเข้าข้อมูลและสกัดรูปถ่ายสำเร็จ!";
        document.getElementById('ocrBadge').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        statusText.innerText = "เกิดข้อผิดพลาดในการประมวลผล";
      }
    }

    function formatIDCard(id) {
      if(id.length !== 13) return id;
      return `${id[0]}-${id.substring(1,5)}-${id.substring(5,10)}-${id.substring(10,12)}-${id.substring(12)}`;
    }

    function handleSubmit(e) {
      e.preventDefault();
      alert("บันทึกข้อมูลและรูปถ่ายผู้ป่วยเรียบร้อยแล้ว!");
    }
  </script>
</body>
</html>
