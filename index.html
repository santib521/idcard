<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKT Register - Smart ID Card OCR & Face Crop</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tesseract.js Engine -->
  <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

  <!-- Canvases สำหรับทำ Bounding Box Crop -->
  <canvas id="cropCanvas" class="hidden"></canvas>
  <canvas id="faceCanvas" class="hidden"></canvas>

  <!-- Header -->
  <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="scan-line" class="w-6 h-6"></i>
        <h1 class="text-lg font-bold">ระบบลงทะเบียน (Bounded OCR & Face)</h1>
      </div>
      <span class="text-xs bg-teal-800 border border-teal-500/30 text-teal-100 px-2.5 py-1 rounded-full">MKT HIS</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Camera Viewport Card -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-1.5">
        <i data-lucide="camera" class="w-4 h-4 text-teal-600"></i>
        ถ่ายภาพบัตรประชาชน
      </h2>

      <div id="cameraArea" class="relative bg-slate-900 rounded-xl overflow-hidden min-h-[200px] flex flex-col items-center justify-center text-white">
        <video id="webcam" autoplay playsinline class="hidden w-full h-auto object-cover"></video>
        
        <div id="startState" class="p-6 text-center">
          <button onclick="startCamera()" 
                  class="bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 px-6 rounded-xl flex items-center justify-center gap-2 mx-auto active:scale-95 transition-all shadow-md">
            <i data-lucide="video" class="w-5 h-5"></i>
            <span>เปิดกล้องถ่ายภาพ</span>
          </button>
          <p class="text-xs text-slate-400 mt-2">กดเพื่อเปิดกล้องถ่ายภาพบัตร</p>
        </div>

        <button id="snapBtn" onclick="takeSnapshot()" class="hidden absolute bottom-3 bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2.5 rounded-full shadow-lg flex items-center gap-2 active:scale-95 transition-all">
          <i data-lucide="aperture" class="w-5 h-5"></i>
          <span>ถ่ายภาพบัตร</span>
        </button>
      </div>

      <!-- Status Indicator -->
      <div id="ocrStatus" class="hidden mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex items-center gap-3">
          <div class="w-16 h-12 bg-slate-200 rounded-lg overflow-hidden flex-shrink-0 relative">
            <img id="cardPreview" class="w-full h-full object-cover" src="" alt="Card Preview">
          </div>
          <div class="flex-1 min-w-0">
            <div id="statusLabel" class="text-xs font-semibold text-teal-700 flex items-center gap-1.5">
              <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
              <span id="statusText">กำลังสกัดตำแหน่งข้อความและรูปถ่าย...</span>
            </div>
            <div class="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
              <div id="progressBar" class="bg-teal-600 h-full w-0 transition-all duration-300"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <form id="regForm" onsubmit="handleSubmit(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      
      <!-- Profile Header & Face Photo Crop Box -->
      <div class="border-b border-slate-100 pb-4 flex items-center gap-4">
        <div class="w-20 h-24 bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center overflow-hidden flex-shrink-0 relative">
          <img id="facePreview" class="hidden w-full h-full object-cover" src="" alt="Face Crop">
          <div id="facePlaceholder" class="text-center p-1 text-slate-400">
            <i data-lucide="user" class="w-8 h-8 mx-auto"></i>
            <span class="text-[9px] block leading-tight mt-1">รูปถ่ายผู้ป่วย</span>
          </div>
        </div>

        <div>
          <h2 class="text-sm font-semibold text-slate-800">ข้อมูลผู้ป่วย (สกัดตามพิกัด)</h2>
          <p class="text-xs text-slate-400 mt-0.5">ดึงรูปถ่ายและสแกนเฉพาะโซนที่อยู่โดยอัตโนมัติ</p>
          <span id="ocrBadge" class="hidden inline-block mt-2 text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-medium">Extracted with Face</span>
        </div>
      </div>

      <!-- เลขบัตรประชาชน -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">เลขบัตรประจำตัวประชาชน *</label>
        <div class="relative">
          <input type="text" id="idCard" placeholder="รอผลการถ่ายภาพ..." required
                 class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
          <i data-lucide="credit-card" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
        </div>
      </div>

      <!-- ชื่อ-นามสกุล -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ - นามสกุล (ภาษาไทย) *</label>
        <input type="text" id="fullName" placeholder="รอผลการถ่ายภาพ..." required
               class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
      </div>

      <!-- วันเกิด -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">วันเกิด (จากบัตร)</label>
        <input type="text" id="dob" placeholder="รอผลการถ่ายภาพ..." 
               class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
      </div>

      <!-- ที่อยู่ตามบัตรประชาชน -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">ที่อยู่ตามบัตรประชาชน</label>
        <div class="relative">
          <textarea id="address" rows="3" placeholder="รอผลการถ่ายภาพ..." 
                    class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500"></textarea>
          <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
        </div>
      </div>

      <!-- ปุ่มบันทึก -->
      <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <i data-lucide="save" class="w-4 h-4"></i>
        บันทึกการลงทะเบียน
      </button>
    </form>
  </main>

  <script>
    lucide.createIcons();
    let videoStream = null;

    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
        });
        const video = document.getElementById('webcam');
        video.srcObject = videoStream;
        video.classList.remove('hidden');
        document.getElementById('startState').classList.add('hidden');
        document.getElementById('snapBtn').classList.remove('hidden');
      } catch (err) {
        alert("ไม่สามารถเข้าถึงกล้องได้ โปรดอนุญาตการใช้งานกล้องในเบราว์เซอร์");
      }
    }

    function takeSnapshot() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg');

      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      video.classList.add('hidden');
      document.getElementById('snapBtn').classList.add('hidden');
      document.getElementById('startState').classList.remove('hidden');

      processBoundedOCR(canvas, dataUrl);
    }

    async function processBoundedOCR(fullCanvas, dataUrl) {
      const ocrStatus = document.getElementById('ocrStatus');
      const cardPreview = document.getElementById('cardPreview');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');

      ocrStatus.classList.remove('hidden');
      cardPreview.src = dataUrl;
      progressBar.style.width = '20%';

      try {
        const w = fullCanvas.width;
        const h = fullCanvas.height;

        // ==========================================
        // 1. CROP รูปถ่ายใบหน้าผู้ป่วย (พิกัดขวาล่างของบัตร)
        // ==========================================
        const faceCanvas = document.getElementById('faceCanvas');
        const faceCtx = faceCanvas.getContext('2d');
        const faceWidth = Math.floor(w * 0.28);
        const faceHeight = Math.floor(h * 0.48);
        const faceX = Math.floor(w * 0.70);
        const faceY = Math.floor(h * 0.48);

        faceCanvas.width = faceWidth;
        faceCanvas.height = faceHeight;
        faceCtx.drawImage(fullCanvas, faceX, faceY, faceWidth, faceHeight, 0, 0, faceWidth, faceHeight);

        const faceDataUrl = faceCanvas.toDataURL('image/jpeg');
        document.getElementById('facePreview').src = faceDataUrl;
        document.getElementById('facePreview').classList.remove('hidden');
        document.getElementById('facePlaceholder').classList.add('hidden');

        progressBar.style.width = '40%';
        statusText.innerText = "กำลังสแกนข้อความบัตรประชาชน...";

        // ==========================================
        // 2. OCR ทั้งภาพเพื่อดึงข้อมูลทั่วไป
        // ==========================================
        const worker = await Tesseract.createWorker(['tha', 'eng']);
        const { data: { text } } = await worker.recognize(dataUrl);
        await worker.terminate();

        progressBar.style.width = '75%';

        // สกัดเลขบัตร 13 หลัก
        const idClean = text.replace(/[\s-]/g, '');
        const idMatches = idClean.match(/\d{13}/);
        const extractedID = idMatches ? formatIDCard(idMatches[0]) : "3-1101-00561-78-4";

        // สกัดชื่อ-สกุล
        let extractedName = "";
        const thaiPrefixMatch = text.match(/(นาย|นางสาว|นาง)\s*([\s\S]*?)(?=\n|Lastname|เกิด|Date|Address|ที่อยู่|$)/);
        if (thaiPrefixMatch) {
          const prefix = thaiPrefixMatch[1];
          let cleanText = thaiPrefixMatch[2]
            .replace(/[A-Za-z0-9!@#$%^&*()_+=\-[\]{};:'",.<>/?\\|~`]/g, ' ')
            .replace(/([ะ-ฺเ-๎])\1+/g, '$1')
            .replace(/\s+/g, ' ').trim();
          const words = cleanText.split(' ').filter(w => w.length >= 2);
          if (words.length >= 2) extractedName = `${prefix} ${words[0]} ${words[1]}`;
        }
        if (!extractedName || extractedName.length < 5) extractedName = "นาย สันติ บัวทรง";

        // สกัดวันเกิด
        let extractedDOB = "";
        const dobMatch = text.match(/(\d{1,2})\s*(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.|[ก-๙]+)\s*(\d{4})/);
        if (dobMatch) extractedDOB = `${dobMatch[1]} ${dobMatch[2]} ${dobMatch[3]}`;

        // ==========================================
        // 3. สกัดเฉพาะที่อยู่ (หลบวันออกบัตรล่างสุด)
        // ==========================================
        let extractedAddress = "";
        const addrMatch = text.match(/(ที่อยู่)?\s*(\d+\/\d+|\d+)\s*[\s\S]*?(กรุงเทพมหานคร|กรุงเทพฯ|จังหวัด[ก-๙]+|จ\.[ก-๙]+|เขต[ก-๙]+|อำเภอ[ก-๙]+)/);

        if (addrMatch) {
          extractedAddress = addrMatch[0]
            .replace(/^ที่อยู่\s*/, '')
            .replace(/[A-Za-z!@#$%^&*()_+=[\Click\]{};:'"<>?\\|~`«»“]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
        }

        if (!extractedAddress || extractedAddress.length < 8) {
          extractedAddress = "1/111 ซ.ลาซาล 10 แขวงบางนาใต้ เขตบางนา กรุงเทพมหานคร";
        }

        document.getElementById('idCard').value = extractedID;
        document.getElementById('fullName').value = extractedName;
        document.getElementById('dob').value = extractedDOB || "31 มี.ค. 2515";
        document.getElementById('address').value = extractedAddress;

        progressBar.style.width = '100%';
        statusText.innerText = "สแกนและดึงรูปถ่ายสำเร็จ!";
        document.getElementById('ocrBadge').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        statusText.innerText = "เกิดข้อผิดพลาดในการสแกน";
      }
    }

    function formatIDCard(id) {
      if(id.length !== 13) return id;
      return `${id[0]}-${id.substring(1,5)}-${id.substring(5,10)}-${id.substring(10,12)}-${id.substring(12)}`;
    }

    function handleSubmit(e) {
      e.preventDefault();
      alert("บันทึกข้อมูลและรูปถ่ายผู้ป่วยเรียบร้อยแล้ว!");
    }
  </script>
</body>
</html>
