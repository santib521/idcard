<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKT Register - Smart ID Card OCR</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tesseract.js Engine -->
  <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

  <!-- Canvas ซ่อนไว้สำหรับทำ Pre-processing ภาพก่อนส่งให้ OCR -->
  <canvas id="procCanvas" class="hidden"></canvas>

  <!-- Header -->
  <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="scan-line" class="w-6 h-6"></i>
        <h1 class="text-lg font-bold">ระบบสแกนบัตรประชาชน (Live OCR)</h1>
      </div>
      <span class="text-xs bg-teal-800 border border-teal-500/30 text-teal-100 px-2.5 py-1 rounded-full">MKT HIS</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Camera Trigger Card -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-1.5">
        <i data-lucide="camera" class="w-4 h-4 text-teal-600"></i>
        ถ่ายภาพบัตรประชาชน
      </h2>

      <!-- Input ถ่ายภาพตรงจากกล้องมือถือ -->
      <input type="file" id="cardInput" accept="image/*" capture="environment" class="hidden" onchange="processRealOCR(event)">

      <button onclick="document.getElementById('cardInput').click()" 
              class="w-full border-2 border-dashed border-teal-500 bg-teal-50/50 hover:bg-teal-50 text-teal-700 font-medium py-4 px-4 rounded-xl flex flex-col items-center justify-center gap-2 transition-all active:scale-[0.98]">
        <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center">
          <i data-lucide="camera" class="w-6 h-6"></i>
        </div>
        <span class="text-sm font-semibold">กดเพื่อเปิดกล้องบนมือถือ</span>
        <span class="text-xs text-slate-400">ถ่ายบัตรในที่สว่าง เพื่อความแม่นยำสูงสุด</span>
      </button>

      <!-- Status Indicator -->
      <div id="ocrStatus" class="hidden mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex items-center gap-3">
          <div class="w-16 h-12 bg-slate-200 rounded-lg overflow-hidden flex-shrink-0 relative">
            <img id="cardPreview" class="w-full h-full object-cover" src="" alt="Card Preview">
          </div>
          <div class="flex-1 min-w-0">
            <div id="statusLabel" class="text-xs font-semibold text-teal-700 flex items-center gap-1.5">
              <i data-lucide="loader-2" class="w-4 h-4 animate-spin" id="spinIcon"></i>
              <span id="statusText">กำลังปรับแต่งภาพและอ่านข้อมูล...</span>
            </div>
            <div class="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
              <div id="progressBar" class="bg-teal-600 h-full w-0 transition-all duration-300"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Extracted Raw Data Debug -->
    <div id="rawTextContainer" class="hidden bg-slate-800 text-slate-200 rounded-xl p-3 text-xs">
      <div class="font-semibold text-teal-400 mb-1 flex items-center gap-1">
        <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
        ข้อความดิบที่สแกนได้จริง (Raw OCR Text):
      </div>
      <div id="rawText" class="font-mono text-[11px] whitespace-pre-wrap break-all max-h-24 overflow-y-auto bg-slate-900/50 p-2 rounded text-slate-300"></div>
    </div>

    <!-- Form Section -->
    <form id="regForm" onsubmit="handleSubmit(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      <div class="border-b border-slate-100 pb-2 flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-800">ข้อมูลผู้ป่วย (สกัดจากบัตร)</h2>
        <span id="ocrBadge" class="hidden text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-medium">Extracted</span>
      </div>

      <!-- เลขบัตรประชาชน -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">เลขบัตรประจำตัวประชาชน *</label>
        <div class="relative">
          <input type="text" id="idCard" placeholder="รอผลการถ่ายภาพ..." required
                 class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
          <i data-lucide="credit-card" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
        </div>
      </div>

      <!-- ชื่อ-นามสกุล -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ - นามสกุล *</label>
        <input type="text" id="fullName" placeholder="รอผลการถ่ายภาพ..." required
               class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
      </div>

      <!-- วันเกิด -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">วันเกิด (จากบัตร)</label>
        <input type="text" id="dob" placeholder="รอผลการถ่ายภาพ..." 
               class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
      </div>

      <!-- ปุ่มบันทึก -->
      <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl shadow-md shadow-teal-600/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <i data-lucide="save" class="w-4 h-4"></i>
        บันทึกการลงทะเบียน
      </button>
    </form>
  </main>

  <script>
    lucide.createIcons();

    // 1. ฟังก์ชันทำ Image Pre-processing (Grayscale + High Contrast)
    function preprocessImage(imgElement) {
      const canvas = document.getElementById('procCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = imgElement.width;
      canvas.height = imgElement.height;

      ctx.drawImage(imgElement, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      // แปลงภาพเป็น Grayscale และเพิ่ม Contrast
      for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        // Binarization threshold
        let v = avg > 115 ? 255 : 0;
        data[i] = v;     // Red
        data[i + 1] = v; // Green
        data[i + 2] = v; // Blue
      }

      ctx.putImageData(imageData, 0, 0);
      return canvas.toDataURL('image/jpeg');
    }

    // 2. ฟังก์ชันประมวลผลสแกนภาพ
    async function processRealOCR(event) {
      const file = event.target.files[0];
      if (!file) return;

      const ocrStatus = document.getElementById('ocrStatus');
      const cardPreview = document.getElementById('cardPreview');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      const rawTextContainer = document.getElementById('rawTextContainer');
      const rawTextElem = document.getElementById('rawText');

      ocrStatus.classList.remove('hidden');
      rawTextContainer.classList.add('hidden');
      progressBar.style.width = '10%';
      statusText.innerText = "กำลังปรับปรุงคุณภาพภาพถ่าย...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        cardPreview.src = e.target.result;

        const img = new Image();
        img.src = e.target.result;
        img.onload = async function() {
          
          // ทำ Image Processing
          const processedImgUrl = preprocessImage(img);
          progressBar.style.width = '30%';
          statusText.innerText = "กำลังประมวลผล OCR (Tesseract Engine)...";

          try {
            // โหลด Worker Tesseract สำหรับภาษาไทยและอังกฤษ
            const worker = await Tesseract.createWorker(['tha', 'eng']);
            
            const { data: { text } } = await worker.recognize(processedImgUrl);
            await worker.terminate();

            // แสดงข้อความดิบ
            rawTextElem.innerText = text || "(ไม่พบข้อความ)";
            rawTextContainer.classList.remove('hidden');
            progressBar.style.width = '80%';

            // --- Regex Cleansing Logic (คลีนขยะออก) ---

            // สกัดเลขบัตรประชาชน 13 หลัก
            const idClean = text.replace(/[\s-]/g, '');
            const idMatches = idClean.match(/\d{13}/);
            const extractedID = idMatches ? formatIDCard(idMatches[0]) : "";

            // สกัดชื่อ-นามสกุล
            let extractedName = "";
            const thaiNameMatch = text.match(/(นาย|นางสาว|นาง)\s*([ก-๙]+)\s+([ก-๙]+)/);
            if (thaiNameMatch) {
              extractedName = `${thaiNameMatch[1]} ${thaiNameMatch[2]} ${thaiNameMatch[3]}`;
            } else {
              const engNameMatch = text.match(/Name\s+(Mr\.|Miss|Mrs\.)?\s*([A-Za-z]+)\s+([A-Za-z]+)/i);
              if (engNameMatch) {
                const prefix = engNameMatch[1] || '';
                extractedName = `${prefix} ${engNameMatch[2]} ${engNameMatch[3]}`.trim();
              }
            }

            // สกัดวันเกิด
            let extractedDOB = "";
            const dobMatch = text.match(/(\d{1,2})\s*(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.|[ก-๙]+)\s*(\d{4})/);
            if (dobMatch) {
              extractedDOB = `${dobMatch[1]} ${dobMatch[2]} ${dobMatch[3]}`;
            }

            // นำค่าที่คลีนได้ใส่ลง Form
            document.getElementById('idCard').value = extractedID || "อ่านไม่ชัดเจน (โปรดพิมพ์เพิ่ม)";
            document.getElementById('fullName').value = extractedName || "อ่านไม่ชัดเจน (โปรดพิมพ์เพิ่ม)";
            document.getElementById('dob').value = extractedDOB || "-";

            progressBar.style.width = '100%';
            statusText.innerHTML = `<span class="text-emerald-700 font-semibold">สแกนเสร็จสิ้น!</span>`;
            document.getElementById('ocrBadge').classList.remove('hidden');

          } catch (err) {
            console.error(err);
            statusText.innerText = "เกิดข้อผิดพลาดในการสแกนภาพ";
          }
        };
      };
      reader.readAsDataURL(file);
    }

    function formatIDCard(id) {
      if(id.length !== 13) return id;
      return `${id[0]}-${id.substring(1,5)}-${id.substring(5,10)}-${id.substring(10,12)}-${id.substring(12)}`;
    }

    function handleSubmit(e) {
      e.preventDefault();
      alert("บันทึกข้อมูลการลงทะเบียนเรียบร้อยแล้ว!");
    }
  </script>
</body>
</html>
