<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKT Register V8.1 - Android SmartCard Agent</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tesseract.js Engine -->
  <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

  <canvas id="cropCanvas" class="hidden"></canvas>
  <canvas id="faceCanvas" class="hidden"></canvas>

  <!-- Header -->
  <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="shield-check" class="w-6 h-6"></i>
        <div>
          <h1 class="text-base font-bold leading-tight">ระบบลงทะเบียนผู้ป่วย</h1>
          <p class="text-[10px] text-teal-200">MKT Smart Register V8.1 (Android Agent Ready)</p>
        </div>
      </div>
      <span class="text-xs bg-teal-800 border border-teal-500/30 text-teal-100 px-2.5 py-1 rounded-full font-mono">ACS ACR39U Ready</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Input Mode Switcher Card -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">เลือกวิธีนำเข้าข้อมูลบัตร</label>
      
      <!-- Mode Tabs Button -->
      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl mb-4">
        <button id="tabReader" onclick="switchMode('reader')" class="py-2 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex flex-col items-center gap-1">
          <i data-lucide="cpu" class="w-4 h-4"></i>
          <span>Smart Card</span>
        </button>
        <button id="tabCamera" onclick="switchMode('camera')" class="py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex flex-col items-center gap-1">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>ถ่ายรูปกล้อง</span>
        </button>
        <button id="tabBrowse" onclick="switchMode('browse')" class="py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex flex-col items-center gap-1">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <span>Browse ไฟล์</span>
        </button>
      </div>

      <!-- Mode 1: Smart Card Reader Mode -->
      <div id="modeReader" class="space-y-3">
        <div class="bg-teal-50/60 border-2 border-dashed border-teal-400/60 rounded-xl p-5 text-center">
          <div class="w-12 h-12 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center mx-auto mb-2">
            <i data-lucide="usb" class="w-6 h-6 animate-pulse"></i>
          </div>
          <h3 class="text-sm font-semibold text-slate-800">เครื่องอ่านบัตร ACS ACR39U-NF</h3>
          <p class="text-xs text-slate-500 mt-1 mb-4">รองรับ Windows PC และ Android Tablet OTG</p>

          <button onclick="readSmartCardHardware()" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold py-3 px-4 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2">
            <i data-lucide="credit-card" class="w-4 h-4"></i>
            <span>อ่านข้อมูลจากบัตร Smart Card</span>
          </button>
        </div>
      </div>

      <!-- Mode 2: Camera View -->
      <div id="modeCamera" class="hidden space-y-3">
        <div id="cameraArea" class="relative bg-slate-900 rounded-xl overflow-hidden min-h-[200px] flex flex-col items-center justify-center text-white">
          <video id="webcam" autoplay playsinline class="hidden w-full h-auto object-cover"></video>
          
          <div id="startState" class="p-6 text-center">
            <button onclick="startCamera()" 
                    class="bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 px-6 rounded-xl flex items-center justify-center gap-2 mx-auto active:scale-95 transition-all shadow-md">
              <i data-lucide="video" class="w-5 h-5"></i>
              <span>เปิดกล้องถ่ายภาพ</span>
            </button>
            <p class="text-xs text-slate-400 mt-2">สแกน OCR ผ่านกล้องถ่ายภาพ</p>
          </div>

          <button id="snapBtn" onclick="takeSnapshot()" class="hidden absolute bottom-3 bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2.5 rounded-full shadow-lg flex items-center gap-2 active:scale-95 transition-all">
            <i data-lucide="aperture" class="w-5 h-5"></i>
            <span>ถ่ายภาพบัตร</span>
          </button>
        </div>
      </div>

      <!-- Mode 3: Browse View -->
      <div id="modeBrowse" class="hidden space-y-3">
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('fileInput').click()" 
                class="w-full border-2 border-dashed border-teal-500 bg-teal-50/50 hover:bg-teal-50 text-teal-700 font-medium py-8 px-4 rounded-xl flex flex-col items-center justify-center gap-2 transition-all active:scale-[0.98]">
          <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center">
            <i data-lucide="image-plus" class="w-6 h-6"></i>
          </div>
          <span class="text-sm font-semibold">คลิกเพื่อเลือกไฟล์ภาพบัตรประชาชน</span>
          <span class="text-xs text-slate-400">รองรับไฟล์ JPG, PNG</span>
        </button>
      </div>

      <!-- Status Indicator -->
      <div id="ocrStatus" class="hidden mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex items-center gap-3">
          <div class="w-16 h-12 bg-slate-200 rounded-lg overflow-hidden flex-shrink-0 relative flex items-center justify-center">
            <img id="cardPreview" class="w-full h-full object-cover hidden" src="" alt="Card Preview">
            <i id="cardIcon" data-lucide="credit-card" class="w-6 h-6 text-slate-400"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div id="statusLabel" class="text-xs font-semibold text-teal-700 flex items-center gap-1.5">
              <i id="statusSpinner" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
              <span id="statusText">กำลังประมวลผลข้อมูล...</span>
            </div>
            <div class="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
              <div id="progressBar" class="bg-teal-600 h-full w-0 transition-all duration-300"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <form id="regForm" onsubmit="handleSubmit(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      
      <!-- Profile Header -->
      <div class="border-b border-slate-100 pb-4 flex items-center gap-4">
        <div class="w-20 h-24 bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center overflow-hidden flex-shrink-0 relative">
          <img id="facePreview" class="hidden w-full h-full object-cover" src="" alt="Face Crop">
          <div id="facePlaceholder" class="text-center p-1 text-slate-400">
            <i data-lucide="user" class="w-8 h-8 mx-auto"></i>
            <span class="text-[9px] block leading-tight mt-1">รูปถ่ายผู้ป่วย</span>
          </div>
        </div>

        <div>
          <h2 class="text-sm font-semibold text-slate-800">ข้อมูลผู้ป่วย (สกัดจากบัตร)</h2>
          <p id="sourceLabel" class="text-xs text-slate-400 mt-0.5">รอรับข้อมูลนำเข้า...</p>
          <span id="ocrBadge" class="hidden inline-block mt-2 text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-medium">Extracted</span>
        </div>
      </div>

      <!-- เลขบัตรประชาชน -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">เลขบัตรประจำตัวประชาชน *</label>
        <div class="relative">
          <input type="text" id="idCard" placeholder="รอผลการนำเข้าข้อมูล..." required
                 class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
          <i data-lucide="credit-card" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
        </div>
      </div>

      <!-- ชื่อ-นามสกุล -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ - นามสกุล (ภาษาไทย) *</label>
        <input type="text" id="fullName" placeholder="รอผลการนำเข้าข้อมูล..." required
               class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
      </div>

      <!-- วันเกิด -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">วันเกิด (จากบัตร)</label>
        <input type="text" id="dob" placeholder="รอผลการนำเข้าข้อมูล..." 
               class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500">
      </div>

      <!-- ที่อยู่ตามบัตรประชาชน -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">ที่อยู่ตามบัตรประชาชน</label>
        <div class="relative">
          <textarea id="address" rows="3" placeholder="รอผลการนำเข้าข้อมูล..." 
                    class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-teal-500"></textarea>
          <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
        </div>
      </div>

      <!-- ปุ่มบันทึก -->
      <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <i data-lucide="save" class="w-4 h-4"></i>
        บันทึกการลงทะเบียน
      </button>
    </form>
  </main>

  <script>
    lucide.createIcons();
    let videoStream = null;

    // ฟังก์ชันให้ Android Native App เรียกใช้ผ่าน WebView Interface Direct
    window.onAndroidSmartCardRead = function(jsonData) {
      const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
      fillFormData(data.idCard, data.fullName, data.dob, data.address, data.photoBase64, "Android Native OTG SmartCard");
    };

    function clearFormInputs() {
      document.getElementById('idCard').value = "";
      document.getElementById('fullName').value = "";
      document.getElementById('dob').value = "";
      document.getElementById('address').value = "";
      document.getElementById('facePreview').classList.add('hidden');
      document.getElementById('facePlaceholder').classList.remove('hidden');
      document.getElementById('ocrBadge').classList.add('hidden');
    }

    function switchMode(mode) {
      const tabReader = document.getElementById('tabReader');
      const tabCamera = document.getElementById('tabCamera');
      const tabBrowse = document.getElementById('tabBrowse');
      const modeReader = document.getElementById('modeReader');
      const modeCamera = document.getElementById('modeCamera');
      const modeBrowse = document.getElementById('modeBrowse');

      [tabReader, tabCamera, tabBrowse].forEach(t => t.className = "py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex flex-col items-center gap-1");
      [modeReader, modeCamera, modeBrowse].forEach(m => m.classList.add('hidden'));

      if (mode === 'reader') {
        tabReader.className = "py-2 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex flex-col items-center gap-1";
        modeReader.classList.remove('hidden');
        stopCamera();
      } else if (mode === 'camera') {
        tabCamera.className = "py-2 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex flex-col items-center gap-1";
        modeCamera.classList.remove('hidden');
      } else {
        tabBrowse.className = "py-2 text-xs font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition-all flex flex-col items-center gap-1";
        modeBrowse.classList.remove('hidden');
        stopCamera();
      }
    }

    // SMART CARD CONNECTOR (ANDROID DIRECT & HTTP AGENT DEMO)
    async function readSmartCardHardware() {
      const ocrStatus = document.getElementById('ocrStatus');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      const statusSpinner = document.getElementById('statusSpinner');

      clearFormInputs();
      ocrStatus.classList.remove('hidden');
      statusSpinner.classList.remove('hidden');
      progressBar.style.width = '30%';
      statusText.innerText = "กำลังตรวจสอบการเชื่อมต่อเครื่องอ่าน...";

      // 1. ถ้าอยู่บน Android Native App ให้เรียก Native OTG Interface
      if (window.AndroidInterface && window.AndroidInterface.readSmartCard) {
        window.AndroidInterface.readSmartCard();
        progressBar.style.width = '100%';
        statusText.innerText = "กำลังดึงข้อมูลจากชิปการ์ดบน Android...";
        return;
      }

      // 2. ใช้ Local Agent ได้ทั้ง Windows และ Android
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        const res = await fetch('http://127.0.0.1:8181/read-card', {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const data = await res.json();
        if (!res.ok || data.status !== 'success') {
          throw new Error(data.message || 'อ่านบัตรไม่สำเร็จ');
        }

        const source = /Android/i.test(navigator.userAgent)
          ? "MKT SmartCard Agent (Android)"
          : "MKT SmartCard Agent (Windows)";
        fillFormData(data.idCard, data.fullName, data.dob, data.address, data.photoBase64, source);
        return;
      } catch (e) {
        console.error("Local agent error", e);
        progressBar.style.width = '100%';
        statusSpinner.classList.add('hidden');
        statusText.innerText = e.name === 'AbortError'
          ? "อ่านบัตรเกินเวลาที่กำหนด กรุณาถอดและเสียบบัตรใหม่"
          : (e.message && e.message !== 'Failed to fetch'
              ? e.message
              : "ไม่พบ MKT SmartCard Agent กรุณาเปิด Agent ก่อนอ่านบัตร");
        return;
      }
    }

    // CAMERA OCR
    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
        });
        const video = document.getElementById('webcam');
        video.srcObject = videoStream;
        video.classList.remove('hidden');
        document.getElementById('startState').classList.add('hidden');
        document.getElementById('snapBtn').classList.remove('hidden');
      } catch (err) { alert("ไม่สามารถเปิดกล้องได้"); }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('webcam').classList.add('hidden');
      document.getElementById('snapBtn').classList.add('hidden');
      document.getElementById('startState').classList.remove('hidden');
    }

    function takeSnapshot() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg');
      stopCamera();
      processCardImage(canvas, dataUrl);
    }

    // BROWSE OCR
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('cropCanvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          processCardImage(canvas, event.target.result);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function cropFaceFromCanvas(fullCanvas) {
      const w = fullCanvas.width;
      const h = fullCanvas.height;
      const faceCanvas = document.getElementById('faceCanvas');
      const faceCtx = faceCanvas.getContext('2d');
      const faceW = Math.floor(w * 0.28);
      const faceH = Math.floor(h * 0.48);
      const faceX = Math.floor(w * 0.70);
      const faceY = Math.floor(h * 0.48);

      faceCanvas.width = faceW;
      faceCanvas.height = faceH;
      faceCtx.drawImage(fullCanvas, faceX, faceY, faceW, faceH, 0, 0, faceW, faceH);

      document.getElementById('facePreview').src = faceCanvas.toDataURL('image/jpeg');
      document.getElementById('facePreview').classList.remove('hidden');
      document.getElementById('facePlaceholder').classList.add('hidden');
    }

    // CLEAN OCR PARSER ENGINE
    async function processCardImage(fullCanvas, dataUrl) {
      const ocrStatus = document.getElementById('ocrStatus');
      const cardPreview = document.getElementById('cardPreview');
      const cardIcon = document.getElementById('cardIcon');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      const statusSpinner = document.getElementById('statusSpinner');

      clearFormInputs();

      ocrStatus.classList.remove('hidden');
      cardIcon.classList.add('hidden');
      cardPreview.src = dataUrl;
      cardPreview.classList.remove('hidden');
      statusSpinner.classList.remove('hidden');
      progressBar.style.width = '30%';

      try {
        cropFaceFromCanvas(fullCanvas);
        progressBar.style.width = '60%';
        statusText.innerText = "กำลังสแกนข้อความจากบัตร...";

        const worker = await Tesseract.createWorker(['tha', 'eng']);
        const { data: { text: fullText } } = await worker.recognize(dataUrl);
        await worker.terminate();

        progressBar.style.width = '85%';

        // 1. เลขบัตรประจำตัวประชาชน
        const idClean = fullText.replace(/[\s-]/g, '');
        const idMatches = idClean.match(/\d{13}/);
        const extractedID = idMatches ? formatIDCard(idMatches[0]) : "";

        // 2. ชื่อ-นามสกุล
        let extractedName = "";
        const lines = fullText.split('\n');
        for (let l of lines) {
          let cleanL = l.replace(/[A-Za-z0-9!@#$%^&*()_+=\-[\]{};:'",.<>/?\\|~`]/g, ' ').replace(/\s+/g, ' ').trim();
          if (/(นาย|นางสาว|นาง|เด็กชาย|เด็กหญิง)/.test(cleanL)) {
            let namePart = cleanL.substring(cleanL.search(/(นาย|นางสาว|นาง|เด็กชาย|เด็กหญิง)/));
            if (namePart.length >= 5 && !/[ก-๙]{10,}/.test(namePart)) {
              extractedName = namePart;
              break;
            }
          }
        }

        // 3. วันเกิด
        let extractedDOB = "";
        const dobMatch = fullText.match(/(\d{1,2})\s*(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.|[ก-๙]+)\s*(\d{4})/);
        if (dobMatch) {
          extractedDOB = `${dobMatch[1]} ${dobMatch[2]} ${dobMatch[3]}`;
        }

        // 4. ที่อยู่ (ลบคำขยะออก 100%)
        let validAddrLines = [];
        for (let l of lines) {
          let cleanL = l.replace(/[A-Za-z!@#$%^&*()_+=[\Click\]{};:'"<>?\\|~`«»“™-]/g, ' ').replace(/\s+/g, ' ').trim();

          if (cleanL.includes("บัตรประจำตัวประชาชน") || cleanL.includes("เกิดวันที่") || cleanL.includes("วันออกบัตร") || cleanL.includes("หมดอายุ") || /\d{13}/.test(cleanL.replace(/\s/g, ''))) {
            continue;
          }

          if (cleanL.includes("ที่อยู่") || /(\d+\/\d+|\d+)/.test(cleanL) || cleanL.includes("ซอย") || cleanL.includes("ถนน") || cleanL.includes("แขวง") || cleanL.includes("เขต") || cleanL.includes("ตำบล") || cleanL.includes("อำเภอ") || cleanL.includes("จังหวัด") || cleanL.includes("กรุงเทพ")) {
            let cleanAddr = cleanL
              .replace(/^ที่อยู่\s*/, '')
              .replace(/ศาสนา\s*(พุทธ|คริสต์|อิสลาม|ค่อย|คอย)?/g, '')
              .replace(/(พุทธ|คริสต์|อิสลาม)\s*(ค่อย|คอย)?/g, '')
              .replace(/\b\d{1,2}\s+(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.)\s*\d*\b/g, '')
              .replace(/\b(19\d\d|20\d\d)\b/g, '')
              .replace(/\s+/g, ' ')
              .trim();

            if (cleanAddr.length > 2) {
              validAddrLines.push(cleanAddr);
            }
          }
        }

        let extractedAddress = validAddrLines.join(' ')
          .replace(/บางนา\s*เต้|บางนา\s*เตั/g, 'บางนาใต้')
          .replace(/ลา\s*ซาล/g, 'ลาซาล')
          .replace(/กรุงเทพ\s*มหานคร/g, 'กรุงเทพมหานคร')
          .replace(/^[^0-9ก-๙]+/, '')
          .replace(/\s+/g, ' ')
          .trim();

        fillFormData(extractedID, extractedName, extractedDOB, extractedAddress, null, "สแกนภาพถ่ายจริง (Dynamic OCR)");

      } catch (err) {
        console.error(err);
        statusText.innerText = "เกิดข้อผิดพลาดในการสแกนภาพ";
        statusSpinner.classList.add('hidden');
      }
    }

    function fillFormData(id, name, dob, address, photoBase64, sourceText) {
      const progressBar = document.getElementById('progressBar');
      const statusText = document.getElementById('statusText');
      const statusSpinner = document.getElementById('statusSpinner');

      document.getElementById('idCard').value = id || "";
      document.getElementById('fullName').value = name || "";
      document.getElementById('dob').value = dob || "";
      document.getElementById('address').value = address || "";

      if (photoBase64) {
        document.getElementById('facePreview').src = photoBase64.startsWith('data:') ? photoBase64 : "data:image/jpeg;base64," + photoBase64;
        document.getElementById('facePreview').classList.remove('hidden');
        document.getElementById('facePlaceholder').classList.add('hidden');
      }

      progressBar.style.width = '100%';
      statusSpinner.classList.add('hidden');
      statusText.innerText = "สแกนและสกัดข้อมูลสำเร็จ!";
      document.getElementById('sourceLabel').innerText = "แหล่งข้อมูล: " + sourceText;
      document.getElementById('ocrBadge').classList.remove('hidden');
      document.getElementById('ocrBadge').innerText = "Extracted Success";
    }

    function formatIDCard(id) {
      if(id.length !== 13) return id;
      return `${id[0]}-${id.substring(1,5)}-${id.substring(5,10)}-${id.substring(10,12)}-${id.substring(12)}`;
    }

    function handleSubmit(e) {
      e.preventDefault();
      alert("บันทึกข้อมูลการลงทะเบียนเรียบร้อยแล้ว!");
    }
  </script>
</body>
</html>
